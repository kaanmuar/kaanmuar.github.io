<title>Spearhead harness — product Lab Tries arena</title>
<!-- Same engines as qa-review.html during a run. Serve from repo root (python -m http.server). -->
<link rel="stylesheet" href="css/qa-review-progress.css?v=spearhead">
<link rel="stylesheet" href="css/qa-review-arena.css?v=20261120g">
<style>
  html, body { margin: 0; background: #050d11; color: #e8f3f4; font: 13px/1.4 Inter, system-ui, sans-serif; }
  body { padding: 8px; }
  .tag { margin: 0 0 8px; font: 700 10px/1.3 Inter, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #f0c85a; }
  .rp { max-width: 100%; }
</style>
</head>
<body>
<p class="tag">Product arena · ReviewArena lab skin · not mobile-live.html</p>
<script>
try { sessionStorage.setItem('qa-review-arena-skin', 'lab'); } catch (e) {}
</script>
<script src="js/qa-review-progress.js"></script>
<script src="js/qa-review-arena-facts.js?v=20261120a"></script>
<script src="js/qa-review-arena-atlas.js?v=20261120a"></script>
<script src="js/qa-review-arena-motion.js?v=20261120e"></script>
<script src="js/qa-review-console.js?v=20261120g"></script>
<script src="js/qa-review-arena.js?v=20261120g"></script>
<script>
(function () {
  function boot() {
    if (!window.ReviewProgress || !window.ReviewArena) return setTimeout(boot, 50);
    ReviewArena.forceSkin('lab');
    ReviewProgress.start({ host: 'example-shop.com', pages: 5 });
    const lines = [
      'Checking robots.txt.',
      '12 same-host links were listed. This review opens at most 5 HTML pages and 2 links deep.',
      'Opening https://example-shop.com/ in headless Chrome.',
      'Running axe-core accessibility checks.',
      'Checking security headers (HSTS, CSP).',
      'Scoring the checks.',
      'Signing the report.',
    ];
    let i = 0;
    function tick() {
      if (i < lines.length) {
        ReviewProgress.line(lines[i++]);
        setTimeout(tick, 900);
      } else {
        setTimeout(function () {
          ReviewProgress.line('Headless Chrome timed out on /checkout.');
          ReviewArena.fail();
        }, 1200);
      }
    }
    setTimeout(tick, 600);
  }
  boot();
})();
</script>
</body>
