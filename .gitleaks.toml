# Gitleaks config for the linter.yml job (#3833), triaged in #3920.
# Allowlist test and vendor fixtures by path. Known public identifiers are allowlisted by LINE, so a real
# secret added to the same file still fails the job.
title = "kaanmuar.github.io gitleaks"

[extend]
useDefault = true

# Fixtures and third-party trees (paths only).
[[allowlists]]
description = "fixtures and third-party trees"
paths = [
  '''(?i)^tests/''',
  '''(?i)^cypress/''',
  '''(?i)^vendor/''',
  '''(?i)^android/app/src/test/''',
  '''(?i)^media/social-posts/''',
  '''(?i)features/robot/''',
  '''(?i)^packages/qa-lab-mcp/test/''',
]

# Public by design (#3920). Each entry names the identifier it covers.
[[allowlists]]
description = "Firebase web and Android client keys: public identifiers, restricted by app and referrer (#3920)"
regexTarget = "line"
regexes = [
  '''"current_key"\s*:''',
  '''"api_key"\s*:\s*\[''',
  '''apiKey\s*:\s*['"]AIza''',
]

[[allowlists]]
description = "IndexNow key: served publicly from the site root by design (#3920)"
regexTarget = "line"
regexes = [
  '''const INDEXNOW_KEY = ['"]''',
  '''\bKEY = ['"]''',
]

[[allowlists]]
description = "Regex literal in the webpush endpoint check, not a credential (#3920)"
regexTarget = "line"
regexes = [
  '''\^https:\\/\\/\[\^\\s\]\{10,1000\}\$''',
  '''!p256dh \|\| !auth \|\| p256dh\.length > 200''',
]

[[allowlists]]
description = "Published captions and scraped report data: prose and URL parameters, not credentials (#3920)"
paths = [
  '''(?i)^assets/social/captions[^/]*\.json$''',
  '''(?i)^assets/live-reports/u-pcgamer-com\.json$''',
]

# Fake qlat_ fixtures from #3626 (PR #3651). Commit allowlist covers the historical patch; regex covers the string.
[[allowlists]]
description = "QA-lab account API token unit-test commit (#3626)"
commits = [
  '''dd9e11fbd7a79b1452e7a8fdea77e8a2d67dbcd8''',
]

[[allowlists]]
description = "Obvious qlat_ fixture prefix in tests (#3626)"
regexTarget = "line"
regexes = [
  '''qlat_aabbccddeeff0011_''',
]
