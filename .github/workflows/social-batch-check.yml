# .github/workflows/social-batch-check.yml
# One-off check for #1060: at 08:45 Bogotá on Oct 25, after the batch and both backup slots of auto-live-reports.yml,
# scripts/social-batch-check.sh comments on #1060 with what the first six-language batch (#794, #1024) did.
# Not in functions/ops-schedule.js, since it does not recur. Delete this file when #1060 closes.

name: Social batch check

on:
  schedule:
    - cron: '45 13 25 10 *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to check (default: auto-<today UTC>)'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
      checks: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Comment on #1060
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ inputs.batch }}
        run: scripts/social-batch-check.sh ${BATCH:+"$BATCH"}
