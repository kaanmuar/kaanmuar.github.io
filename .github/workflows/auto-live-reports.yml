# .github/workflows/auto-live-reports.yml
# Gate → cards (always commit Live Reports + advance state.since) → social (capped clips + Buffer/FB/Telegram).
# Cards never wait on Playwright (#4457). Social ≤ SOCIAL_POSTS_PER_BATCH (12). cards_only / social_only for catch-up (#4444).
# Secrets: PUBLISH_KEY, BUFFER_API_KEY, LIVE_REPORTS_DEPLOY_KEY, FACEBOOK_PAGE_ID/TOKEN (+ _ES), TELEGRAM_BOT_TOKEN.

name: Live reports from user reviews

on:
  schedule:
    - cron: '41 11 * * *' # backup, 06:41 Bogotá
    - cron: '17 13 * * *' # backup, 08:17 Bogotá
  workflow_dispatch:
    inputs:
      since:
        description: 'Read reviews created after this ISO time (default: where the last run stopped)'
        required: false
      dry_run:
        description: 'Build and render only: no commit, no release, no Buffer posts'
        type: boolean
        default: false
      backup:
        description: 'Run only if today''s batch is not on main yet (set by the Firebase ensureLiveReportsBatch trigger)'
        type: boolean
        default: false
      cards_only:
        description: 'Commit Live Report cards and advance state.since without rendering social clips (#4444)'
        type: boolean
        default: false
      social_only:
        description: 'Skip ingest; render the pending batch from data/live-reports-social-batch.json (#4457)'
        type: boolean
        default: false

concurrency:
  group: auto-live-reports
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.today.outputs.go }}
      social_only: ${{ steps.today.outputs.social_only }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run unless today's batch is already on main
        id: today
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          BACKUP: ${{ inputs.backup }}
          SOCIAL_ONLY_IN: ${{ inputs.social_only }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$SOCIAL_ONLY_IN" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "social_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" != "schedule" ] && [ "$BACKUP" != "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "social_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%F)
          DONE=$(gh api --paginate "repos/$REPO/commits?sha=main&since=${TODAY}T00:00:00Z&per_page=100" \
            --jq ".[] | select(.commit.message | contains(\"(auto-$TODAY)\")) | .sha" | wc -l | tr -d ' ')
          PENDING=$(gh api "repos/$REPO/contents/scripts/auto-live-reports.state.json?ref=main" --jq .content 2>/dev/null \
            | tr -d '\n' | base64 -d 2>/dev/null \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log((j.socialPending&&j.socialPending.count)||0)}catch(e){console.log(0)}})" \
            || echo 0)
          if [ "$DONE" != "0" ] && [ "${PENDING:-0}" = "0" ]; then
            echo "Batch auto-$TODAY is already on main with no social pending; this slot has nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "social_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DONE" != "0" ] && [ "${PENDING:-0}" != "0" ]; then
            echo "Cards for auto-$TODAY are on main but socialPending=$PENDING; running social_only."
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "social_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "::warning::No auto-$TODAY batch on main yet, so the $SCHEDULE backup slot is running it; check ensureLiveReportsBatch."
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "social_only=false" >> "$GITHUB_OUTPUT"

  cards:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.social_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      batch: ${{ steps.reports.outputs.batch }}
      cards: ${{ steps.reports.outputs.cards }}
      social: ${{ steps.reports.outputs.social }}
      total: ${{ steps.reports.outputs.total }}
      removed: ${{ steps.reports.outputs.removed }}
      pushed: ${{ steps.commit.outputs.pushed }}
      cards_only: ${{ steps.reports.outputs.cards_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.LIVE_REPORTS_DEPLOY_KEY }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Read new reviews and update Live Reports
        id: reports
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          SINCE: ${{ inputs.since }}
          CARDS_ONLY: ${{ inputs.cards_only }}
        run: |
          EXTRA=""
          [ "$CARDS_ONLY" = "true" ] && EXTRA="--cards-only"
          node scripts/auto-live-reports.js ${SINCE:+--since "$SINCE"} $EXTRA

      - name: Place the new cards in their country
        continue-on-error: true
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
        run: node scripts/live-report-countries.js --recent 2 --apply --no-gemini --decisions

      - name: Install sharp for the hub
        if: ${{ !inputs.dry_run }}
        run: |
          locked() { node -p "require('./package-lock.json').packages['node_modules/$1'].version"; }
          npm install --no-save --ignore-scripts sharp@"$(locked sharp)"

      - name: Rebuild llms-full.txt and the Live Reports counts
        run: python3 scripts/build-llms-full.py

      - name: Install the critical CSS builder
        if: ${{ !inputs.dry_run }}
        run: |
          read -ra deps <<<"$(node scripts/build-critical-css.js --deps)"
          npm install -s --no-save --prefix "$RUNNER_TEMP/critical-css" "${deps[@]}"
          echo "NODE_PATH=$RUNNER_TEMP/critical-css/node_modules" >> "$GITHUB_ENV"

      - name: Read each sent post's numbers from Buffer and Facebook, and the Telegram channel's members
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_TOKEN_ES: ${{ secrets.FACEBOOK_PAGE_TOKEN_ES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL" ]; then
            echo "::warning::Add the TELEGRAM_BOT_TOKEN secret and the TELEGRAM_CHANNEL variable. The Telegram member count was not read today."
          fi
          node scripts/social-metrics.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and publish the cards
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          chmod +x scripts/commit-live-reports.sh
          scripts/commit-live-reports.sh cards "${{ steps.reports.outputs.batch }}" "${{ steps.reports.outputs.cards }}" "${{ steps.reports.outputs.social }}"

      - name: Upload social batch artifact
        if: steps.reports.outputs.social != '0' && steps.reports.outputs.cards_only != '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-reports-batch
          path: |
            previews/auto-live-reports/batch.json
            data/live-reports-social-batch.json
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### Live reports — cards"
            echo "- New or refreshed cards: ${{ steps.reports.outputs.cards || 0 }} (carousel now ${{ steps.reports.outputs.total || '?' }})"
            echo "- Removed on request: ${{ steps.reports.outputs.removed || 0 }}"
            echo "- Social queued: ${{ steps.reports.outputs.social || 0 }} (batch ${{ steps.reports.outputs.batch }})"
          } >> "$GITHUB_STEP_SUMMARY"

  social:
    needs: [gate, cards]
    if: |
      always() && needs.gate.outputs.go == 'true' &&
      !cancelled() &&
      !inputs.dry_run &&
      inputs.cards_only != true &&
      (
        (needs.gate.outputs.social_only == 'true') ||
        (needs.cards.result == 'success' && needs.cards.outputs.social != '0' && needs.cards.outputs.pushed == '1')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the Buffer key
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "::error::Add the BUFFER_API_KEY secret (Buffer → Settings → API). Nothing is published until then, so no review loses its post."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.LIVE_REPORTS_DEPLOY_KEY }}
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download social batch artifact
        if: needs.gate.outputs.social_only != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-reports-batch
          path: .

      - name: Resolve batch id
        id: batch
        run: |
          mkdir -p previews/auto-live-reports data
          if [ -f data/live-reports-social-batch.json ]; then
            BATCH=$(node -p "require('./data/live-reports-social-batch.json').batch")
            SOCIAL=$(node -p "String(require('./data/live-reports-social-batch.json').posts.length)")
          elif [ -f previews/auto-live-reports/batch.json ]; then
            BATCH="${{ needs.cards.outputs.batch }}"
            SOCIAL="${{ needs.cards.outputs.social }}"
            node -e "const fs=require('fs');const posts=JSON.parse(fs.readFileSync('previews/auto-live-reports/batch.json','utf8'));fs.writeFileSync('data/live-reports-social-batch.json',JSON.stringify({batch:process.argv[1],posts,at:new Date().toISOString()},null,1)+'\n')" "$BATCH"
          else
            echo "::error::No social batch on main or in the artifact."
            exit 1
          fi
          if [ ! -f previews/auto-live-reports/batch.json ]; then
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('data/live-reports-social-batch.json','utf8'));fs.writeFileSync('previews/auto-live-reports/batch.json',JSON.stringify(j.posts,null,1)+'\n')"
          fi
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "social=$SOCIAL" >> "$GITHUB_OUTPUT"
          echo "Social batch $BATCH ($SOCIAL posts)"

      - name: Install the renderer
        run: |
          locked() { node -p "require('./package-lock.json').packages['node_modules/$1'].version"; }
          npm install --no-save --ignore-scripts playwright@"$(locked playwright)" sharp@"$(locked sharp)"
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts
          echo "EDGE_TTS=$(command -v edge-tts)" >> "$GITHUB_ENV"
          gh release download studio-assets -p bed.wav -D media/url-review-demos

      - name: Render cards, stories, and clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/tips-studio/build.js --source runs-auto --batch "${{ steps.batch.outputs.batch }}" --start "$(date -u -d tomorrow +%F)" --lang-offset "$(( $(date -u +%s) / 86400 ))"

      - name: Write the captions in six languages
        run: |
          BATCH="${{ steps.batch.outputs.batch }}"
          node scripts/social-hub/translate-captions.js --machine "$BATCH" \
            || { echo "::warning::Google's translator refused; $BATCH keeps the languages the phrasebooks cover."; node scripts/social-hub/translate-captions.js "$BATCH"; }

      - name: Slot the day's reviews in the social calendar
        run: node scripts/social-calendar.js --write --batch "${{ steps.batch.outputs.batch }}"

      - name: Install the critical CSS builder
        run: |
          read -ra deps <<<"$(node scripts/build-critical-css.js --deps)"
          npm install -s --no-save --prefix "$RUNNER_TEMP/critical-css" "${deps[@]}"
          echo "NODE_PATH=$RUNNER_TEMP/critical-css/node_modules" >> "$GITHUB_ENV"

      - name: Clear social pending and commit clips
        id: commit
        run: |
          node scripts/auto-live-reports.js --clear-social-pending
          chmod +x scripts/commit-live-reports.sh
          scripts/commit-live-reports.sh social "${{ steps.batch.outputs.batch }}" "0" "${{ steps.batch.outputs.social }}"

      - name: Release the clips
        if: steps.commit.outputs.pushed == '1'
        run: |
          BATCH="${{ steps.batch.outputs.batch }}"
          gh release create "$BATCH" media/social-posts/$BATCH/clip/*.mp4 --target main --latest=false \
            --title "Requested reviews $BATCH" --notes "TikTok and YouTube clips for the $BATCH Live Reports. Posted through Buffer."

      - name: Wait for a hub rebuild or Pages deploy on main
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/hub-wait.sh

      - name: Queue the posts in Buffer
        if: steps.commit.outputs.pushed == '1'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLIP_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.batch.outputs.batch }}
        run: node scripts/buffer-queue.js --batch "${{ steps.batch.outputs.batch }}"

      - name: Schedule the posts on the Facebook Page
        if: ${{ !cancelled() && steps.commit.outcome == 'success' && steps.commit.outputs.pushed == '1' }}
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID_ES: ${{ secrets.FACEBOOK_PAGE_ID_ES }}
          FACEBOOK_PAGE_TOKEN_ES: ${{ secrets.FACEBOOK_PAGE_TOKEN_ES }}
        run: |
          if [ -z "$FACEBOOK_PAGE_ID" ] || [ -z "$FACEBOOK_PAGE_TOKEN" ]; then
            echo "::warning::Add the FACEBOOK_PAGE_ID and FACEBOOK_PAGE_TOKEN secrets. Batch ${{ steps.batch.outputs.batch }} was not posted to Facebook."
            exit 0
          fi
          node scripts/facebook-queue.js --batch "${{ steps.batch.outputs.batch }}"

      - name: Post the batch to the Telegram channel
        if: ${{ !cancelled() && steps.commit.outcome == 'success' && steps.commit.outputs.pushed == '1' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          TELEGRAM_APP: ${{ vars.TELEGRAM_APP }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL" ]; then
            echo "::warning::Add the TELEGRAM_BOT_TOKEN secret and the TELEGRAM_CHANNEL variable."
            exit 0
          fi
          node scripts/telegram-live.js post

      - name: Edit the channel posts of withdrawn reports
        if: ${{ !cancelled() && steps.commit.outcome == 'success' && steps.commit.outputs.pushed == '1' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          TELEGRAM_APP: ${{ vars.TELEGRAM_APP }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL" ]; then
            echo "::warning::Telegram scrub skipped."
            exit 0
          fi
          node scripts/telegram-live.js scrub

      - name: Commit the Buffer and Facebook ledgers
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: scripts/commit-social-ledgers.sh "${{ steps.batch.outputs.batch || 'check' }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Live reports — social"
            echo "- Batch: ${{ steps.batch.outputs.batch }}"
            echo "- Posts: ${{ steps.batch.outputs.social }}"
          } >> "$GITHUB_STEP_SUMMARY"
