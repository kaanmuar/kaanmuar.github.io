# .github/workflows/auto-live-reports.yml
# Once a day, every publishable user review becomes a Live Report, a feed card, a story, and a clip,
# and goes into the Buffer queues and onto the Facebook Page. Filtering and privacy live in functions/url-review-publish.js.
# Secrets: PUBLISH_KEY (same value as functions/.env), BUFFER_API_KEY (Buffer → Settings → API),
# LIVE_REPORTS_DEPLOY_KEY (write deploy key), FACEBOOK_PAGE_ID (the Graph ID, not the profile ID in Page URLs) and
# FACEBOOK_PAGE_TOKEN (never-expiring Page token from the "QA-lab Page Publisher" Meta app, with pages_manage_posts;
# changing the Facebook password revokes it, see scripts/facebook-queue.js). Deploy keys bypass the "main: fast checks before merge"
# ruleset, so this job pushes its data commit straight to main, with [skip ci].

name: Live reports from user reviews

on:
  # The Firebase ensureLiveReportsBatch function starts the batch at 06:00 Bogotá (dispatch with backup=true),
  # after the country sweep's last tick, because GitHub starts scheduled runs hours late or drops them. These
  # slots are backups: the gate job lets them run only when today's batch commit is not on main yet.
  schedule:
    - cron: '41 11 * * *' # backup, 06:41 Bogotá
    - cron: '17 13 * * *' # backup, 08:17 Bogotá
  workflow_dispatch:
    inputs:
      since:
        description: 'Read reviews created after this ISO time (default: where the last run stopped)'
        required: false
      dry_run:
        description: 'Build and render only: no commit, no release, no Buffer posts'
        type: boolean
        default: false
      backup:
        description: 'Run only if today''s batch is not on main yet (set by the Firebase ensureLiveReportsBatch trigger)'
        type: boolean
        default: false

concurrency:
  group: auto-live-reports
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.today.outputs.go }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run unless today's batch is already on main
        id: today
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.backup }}" != "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          TODAY=$(date -u +%F)
          DONE=$(gh api "repos/${{ github.repository }}/commits?sha=main&since=${TODAY}T00:00:00Z&per_page=100" \
            --jq "[.[] | select(.commit.message | contains(\"(auto-$TODAY)\"))] | length")
          if [ "$DONE" != "0" ]; then
            echo "Batch auto-$TODAY is already on main; this slot ($(date -u +%H:%M) UTC) has nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::warning::No auto-$TODAY batch on main yet, so the ${{ github.event.schedule }} backup slot is running it; check ensureLiveReportsBatch."
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the Buffer key
        if: ${{ !inputs.dry_run }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "::error::Add the BUFFER_API_KEY secret (Buffer → Settings → API). Nothing is published until then, so no review loses its post."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.LIVE_REPORTS_DEPLOY_KEY }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read new reviews and update Live Reports
        id: reports
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          SINCE: ${{ inputs.since }}
        run: node scripts/auto-live-reports.js ${SINCE:+--since "$SINCE"}

      - name: Install the renderer
        if: steps.reports.outputs.social != '0'
        run: |
          npm install --no-save --ignore-scripts playwright@"$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts
          echo "EDGE_TTS=$(command -v edge-tts)" >> "$GITHUB_ENV"
          gh release download studio-assets -p bed.wav -D media/url-review-demos

      - name: Render cards, stories, and clips
        if: steps.reports.outputs.social != '0'
        # The day number moves the language cycle on, so small daily batches still reach all six.
        run: node scripts/tips-studio/build.js --source runs-auto --batch "${{ steps.reports.outputs.batch }}" --start "$(date -u -d tomorrow +%F)" --lang-offset "$(( $(date -u +%s) / 86400 ))"

      - name: Rebuild llms-full.txt and the Live Reports counts
        run: python3 scripts/build-llms-full.py

      - name: Keep the render for a look
        if: inputs.dry_run && steps.reports.outputs.social != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reports.outputs.batch }}
          path: media/social-posts/${{ steps.reports.outputs.batch }}
          retention-days: 7

      - name: Commit and publish the site
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          BATCH="${{ steps.reports.outputs.batch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/live-reports llms.txt llms-full.txt qa-review*.html scripts/auto-live-reports.state.json
          if [ -d "media/social-posts/$BATCH" ]; then
            git add "media/social-posts/$BATCH"
            git add -f "media/social-posts/$BATCH/story"
          fi
          if git diff --cached --quiet; then echo "pushed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "Live reports: ${{ steps.reports.outputs.cards }} reviews, ${{ steps.reports.outputs.social }} posts ($BATCH) [skip ci]"
          # PRs merged during the render move main. The checkout is shallow, so the data commit is
          # cherry-picked onto the new main (its files win) and the generated files are rebuilt from the merged site.
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && break
            if [ "$attempt" = 5 ]; then echo "::error::main kept moving; batch $BATCH was not pushed."; exit 1; fi
            sleep $((attempt * 5))
            DATA=$(git rev-parse HEAD)
            git fetch -q --depth=1 origin main
            git reset -q --hard FETCH_HEAD
            git cherry-pick -X theirs "$DATA"
            python3 scripts/build-llms-full.py
            git add llms.txt llms-full.txt qa-review*.html
            git diff --cached --quiet || git commit -q --amend --no-edit
          done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Release the clips
        if: ${{ !inputs.dry_run && steps.reports.outputs.social != '0' }}
        run: |
          BATCH="${{ steps.reports.outputs.batch }}"
          gh release create "$BATCH" media/social-posts/$BATCH/clip/*.mp4 --target main --latest=false \
            --title "Requested reviews $BATCH" --notes "TikTok and YouTube clips for the $BATCH Live Reports. Posted through Buffer."

      - name: Queue the posts in Buffer
        if: ${{ !inputs.dry_run && steps.reports.outputs.social != '0' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLIP_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.reports.outputs.batch }}
        run: node scripts/buffer-queue.js --batch "${{ steps.reports.outputs.batch }}"

      - name: Schedule the posts on the Facebook Page
        if: ${{ !cancelled() && steps.commit.outcome == 'success' && steps.reports.outputs.social != '0' && steps.reports.outputs.batch != '' }}
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          if [ -z "$FACEBOOK_PAGE_ID" ] || [ -z "$FACEBOOK_PAGE_TOKEN" ]; then
            echo "::warning::Add the FACEBOOK_PAGE_ID and FACEBOOK_PAGE_TOKEN secrets. Batch ${{ steps.reports.outputs.batch }} was not posted to Facebook; run scripts/facebook-queue.js --batch ${{ steps.reports.outputs.batch }} once they are set."
            exit 0
          fi
          node scripts/facebook-queue.js --batch "${{ steps.reports.outputs.batch }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Live reports from user reviews"
            echo "- New or refreshed cards: ${{ steps.reports.outputs.cards || 0 }} (carousel now ${{ steps.reports.outputs.total || '?' }})"
            echo "- Removed on request: ${{ steps.reports.outputs.removed || 0 }}"
            echo "- Social posts: ${{ steps.reports.outputs.social || 0 }} (batch ${{ steps.reports.outputs.batch }})"
          } >> "$GITHUB_STEP_SUMMARY"
