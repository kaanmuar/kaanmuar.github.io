# .github/workflows/domain-index.yml
# Monthly: rebuilds assets/domains/ (the hosts behind the URL Review "Public page" suggestions)
# from the Chrome UX Report top origins and the Tranco list. Runs an hour after the sweep seeds.
# Pushes straight to main with LIVE_REPORTS_DEPLOY_KEY, like the sweep seeds. Schedule: functions/ops-schedule.js.

name: Domain index

on:
  schedule:
    - cron: '0 10 16 * *'
  workflow_dispatch:

concurrency:
  group: domain-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ssh-key: ${{ secrets.LIVE_REPORTS_DEPLOY_KEY }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build the index
        id: index
        run: node scripts/build-domain-index.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A assets/domains
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Domain index: ${{ steps.index.outputs.hosts }} hosts (${{ steps.index.outputs.before }} before) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && break
            if [ "$attempt" = 5 ]; then echo "::error::main kept moving; the index was not pushed."; exit 1; fi
            sleep $((attempt * 5))
            DATA=$(git rev-parse HEAD)
            git fetch -q --depth=1 origin main
            git reset -q --hard FETCH_HEAD
            if ! git cherry-pick -X theirs "$DATA"; then
              [ -z "$(git status --porcelain)" ] || exit 1
              echo "main already has this index."; exit 0
            fi
          done
