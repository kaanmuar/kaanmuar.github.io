# Schedules every rendered social batch on the QA-lab Facebook Page as its calendar slots come within the
# Graph API's 29-day window. Captions already scheduled or published on the Page are skipped, so a rerun is
# safe. Needs the FACEBOOK_PAGE_ID and FACEBOOK_PAGE_TOKEN secrets (see scripts/facebook-queue.js).
# The run also updates the Page's ledger, assets/social/facebook.json, and pushes it to main with the
# LIVE_REPORTS_DEPLOY_KEY write deploy key, like the Live Reports workflow.
name: Facebook Page queue

on:
  schedule:
    # dispatchFacebookQueue (functions/index.js) starts the queue at 11:07 Bogotá, because GitHub starts this
    # slot hours late. The slot is the backup; a second run the same day only finds the slots already queued.
    - cron: '7 16 * * *' # 11:07 Bogotá, clear of the Live Reports slots
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only report what the Page has scheduled'
        type: boolean
        default: false
      reslot:
        description: 'Move queued posts to the later calendar.csv slots scripts/facebook-reslot.js wrote (delete and re-create, #1140)'
        type: boolean
        default: false
      dry_run:
        description: 'reslot only: list the moves, change nothing'
        type: boolean
        default: true

concurrency:
  group: facebook-page
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ssh-key: ${{ secrets.LIVE_REPORTS_DEPLOY_KEY }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Schedule the slots now within reach
        id: queue
        if: ${{ !inputs.check_only && !inputs.reslot }}
        run: node scripts/facebook-queue.js --all
      - name: Move posts to their later slots
        id: reslot
        if: ${{ inputs.reslot && !inputs.check_only }}
        run: |
          set -o pipefail
          node scripts/facebook-queue.js --reslot ${{ inputs.dry_run && '--dry-run' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the Facebook ledger
        if: ${{ !cancelled() && !inputs.check_only && (steps.queue.outcome != 'skipped' || (steps.reslot.outcome != 'skipped' && !inputs.dry_run)) }}
        run: scripts/commit-social-ledgers.sh "Facebook Page queue"
      - name: Report the Page's queue
        if: always()
        run: node scripts/facebook-queue.js --check | tee -a "$GITHUB_STEP_SUMMARY"
