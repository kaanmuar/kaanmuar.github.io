# .github/workflows/pagespeed-merge.yml
# Started by Jarvis (functions/jarvis-pagespeed.js) when a PageSpeed PR's countdown ends or Carlos clicks Merge (#1978).
# Jarvis's app token may not write contents, so this squashes the pagespeed/* branch onto main and pushes it with
# LIVE_REPORTS_DEPLOY_KEY, which starts CI and the Pages build like any merge. It refuses a PR that is not open, not a
# PageSpeed branch, or whose CI is not green. The last step tells Jarvis (op pagespeed-merged), which pushes the result.

name: PageSpeed merge
run-name: Merge PageSpeed PR #${{ inputs.pr }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number'
        required: true
      by:
        description: 'Who asked'
        required: false
        default: 'jarvis'

concurrency:
  group: pagespeed-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
      BY: ${{ inputs.by }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.LIVE_REPORTS_DEPLOY_KEY }}
      - name: Check the PR and its CI
        id: pr
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Not a PR number."; exit 1; }
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          state=$(jq -r .state "$RUNNER_TEMP/pr.json"); ref=$(jq -r .head.ref "$RUNNER_TEMP/pr.json"); sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")
          mergeable=$(jq -r .mergeable "$RUNNER_TEMP/pr.json")
          [ "$state" = open ] || { echo "::error::#$PR is $state."; exit 1; }
          [[ "$ref" =~ ^pagespeed/(safe|ai)-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::$ref is not a PageSpeed branch."; exit 1; }
          if [ "$mergeable" = "null" ]; then
            sleep 3
            gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.json"
            mergeable=$(jq -r .mergeable "$RUNNER_TEMP/pr.json")
          fi
          # A conflicting PR never gets pull_request CI, so the required checks stay missing (#2242).
          [ "$mergeable" != "false" ] || { echo "::error::#$PR conflicts with main, so GitHub did not run its checks. The branch must not commit generated social hub files."; exit 1; }
          gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          bad=$(jq -r '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("failure","timed_out","cancelled","action_required","startup_failure","stale"))) | .name] | unique | join(", ")' "$RUNNER_TEMP/checks.json")
          [ -z "$bad" ] || { echo "::error::CI failed on $sha: $bad."; exit 1; }
          for need in "Lint Code" url-review-unit playwright; do
            jq -e --arg n "$need" 'any(.check_runs[]; .name == $n and .conclusion == "success")' "$RUNNER_TEMP/checks.json" > /dev/null || { echo "::error::$need has not passed on $sha."; exit 1; }
          done
          { echo "ref=$ref"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          jq -r .title "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/title.txt"
      - name: Squash it onto main and push
        env:
          REF: ${{ steps.pr.outputs.ref }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "$REF"
          [ "$(git rev-parse FETCH_HEAD)" = "$SHA" ] || { echo "::error::$REF moved since CI ran."; exit 1; }
          for attempt in 1 2 3 4 5; do
            git merge -q --squash "$SHA"
            git commit -q -m "$(cat "$RUNNER_TEMP/title.txt") (#$PR)" -m "Merged by Jarvis's PageSpeed routine (#1978) for $BY."
            git push -q origin HEAD:main && break
            if [ "$attempt" = 5 ]; then echo "::error::main kept moving; #$PR was not merged."; exit 1; fi
            sleep $((attempt * 5))
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "MERGED=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Close the PR and delete the branch
        env:
          REF: ${{ steps.pr.outputs.ref }}
        run: |
          gh api "repos/$REPO/issues/$PR/comments" -f body="Merged into main as $MERGED by Jarvis's PageSpeed routine, for $BY." > /dev/null
          gh api -X PATCH "repos/$REPO/pulls/$PR" -f state=closed > /dev/null
          git push -q origin --delete "$REF" || true
      - name: Tell Jarvis
        if: always()
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' -d "{\"op\":\"pagespeed-merged\",\"pr\":$PR,\"run\":$GITHUB_RUN_ID}" \
            https://us-central1-carlosm-interactive-cv.cloudfunctions.net/jarvis || echo "::warning::Jarvis did not hear the result; its hourly watch will."
