# Posts Live Report write-ups and tips from the social hub to dev.to as articles, at most one a day per face
# (scripts/devto-queue.js, #2326). en/de/fr/it go to @qalaburlreview with DEVTO_API_KEY, es/pt to @qaurlreview with
# DEVTO_API_KEY_ES (scripts/face-route.js, #2310). Without either key nothing is posted.
# The run updates the ledger, assets/social/devto.json, and pushes it to main with the LIVE_REPORTS_DEPLOY_KEY write
# deploy key, like the other social queues.
name: dev.to articles

on:
  schedule:
    - cron: '27 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the articles each face would post, post nothing'
        type: boolean
        default: false

concurrency:
  group: devto
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      DEVTO_API_KEY_ES: ${{ secrets.DEVTO_API_KEY_ES }}
    steps:
      - name: Check a key is set
        id: ready
        run: |
          if [ -n "$DEVTO_API_KEY$DEVTO_API_KEY_ES" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No dev.to key yet, so nothing is posted (see scripts/devto-queue.js)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ok == 'true'
        with:
          ssh-key: ${{ secrets.LIVE_REPORTS_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: '22'
      - name: Wait for a hub rebuild or Pages deploy on main
        if: steps.ready.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/hub-wait.sh
      - name: Post today's articles
        id: post
        if: steps.ready.outputs.ok == 'true'
        run: node scripts/devto-queue.js ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit the ledger
        if: ${{ !cancelled() && !inputs.dry_run && steps.post.outcome != 'skipped' }}
        run: |
          if git status --porcelain assets/social/devto.json | grep -q .; then
            scripts/commit-social-ledgers.sh "dev.to"
          else
            echo "Nothing went out."
          fi
