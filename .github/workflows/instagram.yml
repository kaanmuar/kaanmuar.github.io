# Publishes the instagram and instagram-story slots of every rendered social batch on the QA-lab Instagram
# account as they come due. The Instagram API cannot schedule ahead, so this runs every 20 minutes; each run
# covers the time since the previous run started (see scripts/instagram-queue.js). Uses the FACEBOOK_PAGE_ID
# and FACEBOOK_PAGE_TOKEN secrets; the Page token needs instagram_basic and instagram_content_publish.
name: Instagram queue

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Publish story slots after this ISO time (default: when the previous run started; at most 24 hours back)'
        required: false

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/instagram-queue.js
            media/social-posts/*/calendar.csv
            media/social-posts/*/captions.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish the slots that came due
        env:
          SINCE: ${{ inputs.since }}
        run: |
          UNTIL=$(gh run view ${{ github.run_id }} -R ${{ github.repository }} --json createdAt -q .createdAt)
          if [ -z "$SINCE" ]; then
            SINCE=$(gh run list -R ${{ github.repository }} -w instagram.yml -L 5 --json databaseId,createdAt \
              -q '[.[] | select(.databaseId != ${{ github.run_id }})][0].createdAt // empty')
          fi
          node scripts/instagram-queue.js --until "$UNTIL" ${SINCE:+--since "$SINCE"}
      - name: Report the account
        if: always()
        run: node scripts/instagram-queue.js --check | tee -a "$GITHUB_STEP_SUMMARY"
