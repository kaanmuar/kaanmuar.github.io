name: fb-diagnose (temporary, #2464)
on:
  push:
    branches: [fix/2464-facebook-numbers]
    paths: [.github/workflows/fb-diagnose.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run the new facebookNumbers read-only
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          node -e '
          const m = require("./scripts/social-metrics"), q = require("./scripts/social-ledger");
          const entries = m.sentEntries(q.read(q.FACEBOOK), ["facebook"]);
          const report = {};
          m.facebookNumbers(entries, process.env.FACEBOOK_PAGE_TOKEN, fetch, report).then((found) => {
            console.log("REPORT " + JSON.stringify(report).slice(0, 400));
            console.log("WITH_NUMBERS " + found.filter((f) => Object.keys(f.numbers).length).length);
          });'
