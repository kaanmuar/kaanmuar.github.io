name: fb-diagnose (temporary, #2464)
on:
  push:
    branches: [fix/2464-facebook-numbers]
    paths: [.github/workflows/fb-diagnose.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Ask the Graph API about the token and sent posts
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          node -e '
          const T = process.env.FACEBOOK_PAGE_TOKEN, G = "https://graph.facebook.com/v23.0";
          if (!T) { console.log("FACEBOOK_PAGE_TOKEN is empty"); process.exit(0); }
          const get = async (p, q = {}) => { const r = await fetch(G + "/" + p + "?" + new URLSearchParams({ access_token: T, ...q })); const j = await r.json().catch(() => ({})); return { status: r.status, j }; };
          const show = (label, r) => console.log(label, r.status, JSON.stringify(r.j.error ? { message: r.j.error.message, code: r.j.error.code, sub: r.j.error.error_subcode, type: r.j.error.type } : r.j).slice(0, 400));
          (async () => {
            const d = await get("debug_token", { input_token: T });
            const x = d.j.data || {};
            console.log("debug_token", d.status, JSON.stringify({ valid: x.is_valid, type: x.type, expires_at: x.expires_at, scopes: x.scopes, profile: x.profile_id, error: x.error && x.error.message }));
            show("me", await get("me", { fields: "id,name" }));
            const book = require("./assets/social/facebook.json");
            const sent = Object.values(book.posts).flat().filter((e) => e.result === "sent" && e.id).slice(-3);
            for (const e of sent) {
              show("post " + e.id, await get(e.id, { fields: "comments.summary(true).limit(0),reactions.summary(true).limit(0)" }));
              show("  plain " + e.id, await get(e.id, { fields: "id,created_time,is_published" }));
              const photo = e.id.split("_")[1];
              show("  photo " + photo, await get(photo, { fields: "id,page_story_id,reactions.summary(true).limit(0),comments.summary(true).limit(0)" }));
              for (const m of ["post_media_view", "post_impressions", "post_impressions_unique", "post_video_views"]) show("  insight " + m, await get(e.id + "/insights", { metric: m }));
            }
          })();'
