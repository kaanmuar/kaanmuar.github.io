# Queues one committed social batch (media/social-posts/<batch>) in Buffer, for batches the daily Live Reports
# job does not queue itself, such as the social hub promo. Clips come from the GitHub release named after the
# batch (gh release create <batch> media/social-posts/<batch>/clip/*.mp4); without one, TikTok and YouTube are
# skipped. Posts marked hold in captions.json stay in the hub only. Needs the BUFFER_API_KEY secret.
# Hub first: a post whose page on the social hub is not live yet is held (scripts/hub-gate.js). Mode seed reads
# what Buffer already holds into assets/social/buffer.json without queueing anything; mode check asks Buffer which
# queued posts went out; a seed also keeps the sent posts no batch has as the unmatched-sent artifact, which
# scripts/hub-backfill.js puts on the hub (#1038). Mode sync moves the posts Buffer already holds to their calendar.csv slots
# (scripts/social-calendar.js --sync), editing them in place in 15-minute windows of Buffer calls; the Facebook
# Page keeps its times. Buffer's daily call budget moves a few hundred a day, so a nightly run resumes the sync
# until nothing is left. Mode delete-unmatched deletes the scheduled
# posts dated after now that match no batch post (not on the hub), then re-seeds; a dry run only lists them.
# Mode requeue deletes the queued posts listed in posts (batch/slug, comma-separated) on one channel and creates
# them again from the batch's captions.json at the same time, for a caption fixed after queueing (#1191).
# A queue that finds Buffer's daily limit spent lists its batch under retry in the ledger and passes (#1188). The
# nightly run, before the sync and whatever pauses the sync, queues those batches again; mode retry does it by hand.
# Every mode but a dry run commits the ledger (scripts/commit-social-ledgers.sh).
name: Buffer batch queue

on:
  schedule:
    - cron: '37 3 * * *' # sync, 22:37 Bogotá, clear of the Live Reports queue
  workflow_dispatch:
    inputs:
      mode:
        description: 'queue a batch, seed the ledger from Buffer, check queued posts, sync queued posts to the calendar, re-queue the batches a spent limit stopped, delete scheduled posts not on the hub, or delete and requeue listed posts'
        type: choice
        options: [queue, seed, check, sync, retry, delete-unmatched, requeue]
        default: queue
      batch:
        description: 'Batch folder under media/social-posts, e.g. promo-social-hub-2026-10 (queue only)'
        required: false
      dry_run:
        description: 'List what would be queued or deleted, change nothing'
        type: boolean
        default: false
      posts:
        description: 'requeue only: batch/slug,batch/slug'
        required: false
      channel:
        description: 'requeue only: the calendar channel, e.g. youtube'
        required: false
        default: 'youtube'
      windows:
        description: 'sync only: 15-minute windows of Buffer calls before it stops (about 115 calls each)'
        required: false
        default: '1'

concurrency:
  group: buffer-batch
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.mode || 'sync') == 'sync' && 110 || 30 }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode || 'sync' }}
      BATCH: ${{ inputs.batch }}
      DRY_RUN: ${{ inputs.dry_run }}
      WINDOWS: ${{ inputs.windows || '4' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ssh-key: ${{ secrets.LIVE_REPORTS_DEPLOY_KEY }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Queue the batches a spent Buffer limit stopped
        if: ${{ github.event_name == 'schedule' || env.MODE == 'retry' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set -o pipefail
          batches=$(node scripts/buffer-queue.js --pending)
          [ -n "$batches" ] || { echo "No batch waits for a retry."; exit 0; }
          failed=""
          for b in $batches; do
            if gh release view "$b" > /dev/null 2>&1; then clip="https://github.com/${{ github.repository }}/releases/download/$b"; else clip=""; fi
            if [ "$DRY_RUN" = "true" ]; then set -- --dry-run; else set --; fi
            CLIP_BASE="$clip" node scripts/buffer-queue.js --batch "$b" "$@" | tee -a "$GITHUB_STEP_SUMMARY" || failed="$failed $b"
          done
          if [ -n "$failed" ]; then echo "::error::Not fully queued:$failed"; exit 1; fi
      - name: Move queued posts to their calendar slots
        if: ${{ !cancelled() && env.MODE == 'sync' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PAUSE_UNTIL: ${{ vars.BUFFER_SYNC_PAUSE_UNTIL }}
        run: |
          set -o pipefail
          if [ -n "$PAUSE_UNTIL" ] && [ "$(date -u +%s)" -lt "$(date -u -d "$PAUSE_UNTIL" +%s)" ]; then
            echo "Sync paused until $PAUSE_UNTIL (repo variable BUFFER_SYNC_PAUSE_UNTIL), so other Buffer jobs have the day's calls." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if ! [[ "$WINDOWS" =~ ^[1-6]$ ]]; then echo "::error::windows is 1 to 6"; exit 1; fi
          if [ "$DRY_RUN" = "true" ]; then node scripts/social-calendar.js --sync --dry-run; else node scripts/social-calendar.js --sync --windows "$WINDOWS"; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Seed or check the ledger
        if: ${{ env.MODE == 'seed' || env.MODE == 'check' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_SEED_EXPORT: ${{ runner.temp }}/unmatched-sent.json
        run: |
          set -o pipefail
          node scripts/buffer-queue.js "--$MODE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the sent posts that match no hub post
        if: ${{ env.MODE == 'seed' && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unmatched-sent
          path: ${{ runner.temp }}/unmatched-sent.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Delete scheduled posts that match no hub post
        if: ${{ env.MODE == 'delete-unmatched' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set -o pipefail
          if [ "$DRY_RUN" = "true" ]; then node scripts/buffer-queue.js --delete-unmatched --dry-run; else node scripts/buffer-queue.js --delete-unmatched && node scripts/buffer-queue.js --seed; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Requeue posts with fixed captions
        if: ${{ env.MODE == 'requeue' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          POSTS: ${{ inputs.posts }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -o pipefail
          if [ "$DRY_RUN" = "true" ]; then node scripts/buffer-queue.js --requeue "$POSTS" --channel "$CHANNEL" --dry-run; else node scripts/buffer-queue.js --requeue "$POSTS" --channel "$CHANNEL"; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Queue the batch
        if: ${{ env.MODE == 'queue' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          if ! [[ "$BATCH" =~ ^[a-z0-9-]+$ ]] || [ ! -f "media/social-posts/$BATCH/captions.json" ]; then
            echo "::error::No committed batch media/social-posts/$BATCH"; exit 1
          fi
          if gh release view "$BATCH" > /dev/null 2>&1; then
            export CLIP_BASE="https://github.com/${{ github.repository }}/releases/download/$BATCH"
          else
            echo "::warning::No $BATCH release, so TikTok and YouTube are skipped."
          fi
          if [ "$DRY_RUN" = "true" ]; then node scripts/buffer-queue.js --batch "$BATCH" --dry-run; else node scripts/buffer-queue.js --batch "$BATCH"; fi
      - name: Commit the Buffer ledger
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: scripts/commit-social-ledgers.sh "Buffer $MODE ${BATCH:-all}"
