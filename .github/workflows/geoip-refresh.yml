name: GeoIP refresh
# Daily refresh of the ip-location-db .mmdb files in R2 (#4031) that workers/shared/geoip.js reads through the GEOIP binding.
# Does nothing until the repo variable GEOIP_BUCKET and the secrets CLOUDFLARE_API_TOKEN (R2 edit) and CLOUDFLARE_ACCOUNT_ID
# exist, so it is safe to merge before R2 is enabled. The files are never committed.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoip-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEOIP_BUCKET: ${{ vars.GEOIP_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until configured
        id: gate
        run: |
          if [ -z "$GEOIP_BUCKET" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "GEOIP_BUCKET, CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: nothing to refresh (#4031)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - name: Install cf
        if: steps.gate.outputs.run == 'true'
        run: npm ci --prefix workers/preflight
      - name: Download and upload to R2
        if: steps.gate.outputs.run == 'true'
        run: PATH="$PWD/workers/preflight/node_modules/.bin:$PATH" node scripts/geoip-fetch.js
