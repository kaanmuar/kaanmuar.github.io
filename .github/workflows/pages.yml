# .github/workflows/pages.yml
# Builds the site artifact from an allowlist (scripts/build-pages.js) and checks it (scripts/check-pages.js), so
# functions, scripts, tests and designs are never published. Pull requests build and check only.
# The deploy job runs only when Settings > Pages > Source is GitHub Actions (build_type workflow), or when the
# repo variable PAGES_FROM_ACTIONS is 'true'; while the source is the legacy branch build it is skipped.

name: Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_type: ${{ steps.source.outputs.build_type }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the site from the allowlist
        run: node scripts/build-pages.js _site
      - name: No forbidden paths, every local link resolves
        run: node scripts/check-pages.js _site
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
          retention-days: 1
      - name: Read the Pages source
        id: source
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .build_type 2>/dev/null || true)
          echo "Pages build_type: ${build_type:-unknown}"
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (needs.build.outputs.build_type == 'workflow' || vars.PAGES_FROM_ACTIONS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
