name: Jarvis Android

# Builds the Jarvis app on every change under android/. On main it signs the APK and attaches it to a GitHub Release.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/jarvis-android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/jarvis-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      JARVIS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History and tags, without old file contents, for the What's new lines.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests and debug build
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug

      - name: What's new
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/whats-new"
          node scripts/jarvis-whats-new.js "$GITHUB_SHA" | tee "$RUNNER_TEMP/whats-new/whats-new.txt"

      - name: Signed release
        if: github.event_name != 'pull_request'
        env:
          JARVIS_WHATS_NEW_DIR: ${{ runner.temp }}/whats-new
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
          JARVIS_KEYSTORE="$RUNNER_TEMP/jarvis.jks" ./gradlew --console=plain assembleRelease
          for w in Status Numbers Goals Needs Alerts Ask Money Health Social Next Pipeline Marketing Traffic Pick; do
            c="com.carlosandmunoz.jarvis.home.${w}Widget"
            grep -qx "$c -> $c:" app/build/outputs/mapping/release/mapping.txt || { echo "::error::R8 renamed or merged $c; each widget would draw another's content"; exit 1; }
          done
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/jarvis-1.0.${JARVIS_VERSION_CODE}.apk"
          mv wear/build/outputs/apk/release/wear-release.apk "$RUNNER_TEMP/jarvis-watch-1.0.${JARVIS_VERSION_CODE}.apk"

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="1.0.${JARVIS_VERSION_CODE}"
          new="$RUNNER_TEMP/whats-new/whats-new.txt"
          {
            if [ -s "$new" ]; then echo "What's new:"; sed 's/^/- /' "$new"; echo; fi
            echo "First install: open this page on the phone, download jarvis-$v.apk, allow installs from the browser if asked. After that the app updates itself. Wear OS watch: install jarvis-watch-$v.apk with \`adb install\` over Wi-Fi debugging. Built from ${GITHUB_SHA::7}."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "jarvis-android-v$v" "$RUNNER_TEMP/jarvis-$v.apk" "$RUNNER_TEMP/jarvis-watch-$v.apk" --target "$GITHUB_SHA" --latest=false \
            --title "Jarvis for Android $v" --notes-file "$RUNNER_TEMP/notes.md"

      # The function reads the release from GitHub itself and pushes each version once, so no secret is needed.
      - name: Tell the phones to update
        if: github.event_name != 'pull_request'
        run: |
          curl -fsS --retry 3 -X POST -H 'Content-Type: application/json' -d '{"op":"app-release"}' \
            https://us-central1-carlosm-interactive-cv.cloudfunctions.net/jarvis || echo "::warning::The update push failed; phones will still update within six hours."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: jarvis-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 2
