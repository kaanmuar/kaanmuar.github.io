# One-time run of the #1037 handoff once Buffer's daily limit clears (#1198). Dry runs every batch and the Shorts
# requeue (#1191) first and stops if one fails; then runs each live step through buffer-batch.yml about 15 minutes
# apart, watching each run: the six batch queues (auto-2026-10-25 from #1188 first), the requeue of the Shorts with the translated brand name (#1076),
# then the seed (#1044). A live step that fails does not stop the next; the summary lists them. The nightly sync is
# paused for that night (repo variable BUFFER_SYNC_PAUSE_UNTIL). Delete this file once it has run.
name: Buffer handoff (once)

on:
  schedule:
    - cron: '0 9 26 10 *' # Oct 26, 04:00 Bogotá
  workflow_dispatch:
    inputs:
      start:
        description: 'First live step to run (1 to 8), to resume after a stop'
        required: false
        default: '1'

concurrency:
  group: buffer-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      START: ${{ inputs.start || '1' }}
      BATCHES: auto-2026-10-25 digest-2026-10-30 series-dia-de-muertos-2026-11 compare-2026-11 evergreen-2026-11 skits-friday-release
      POSTS: auto-2026-10-22/03-u-whatsapp-com,auto-2026-10-24/01-u-grupoexito-com-co,auto-2026-10-23/02-u-postobon-com,auto-2026-10-23/03-u-monsterenergy-com,auto-2026-10-24/02-u-colombia-com,auto-2026-10-22/04-u-telegram-com,auto-2026-10-24/03-u-nibo-com-br,auto-2026-10-22/05-u-lamega-com-co,auto-2026-10-22/06-u-cognizant-com,auto-2026-10-24/04-u-kreuzwort-raetsel-net,auto-2026-10-22/08-u-avvillas-com-co,auto-2026-10-22/09-u-lenovo-com,auto-2026-10-22/10-u-uniminuto-edu,auto-2026-10-22/11-u-davibank-com,auto-2026-10-22/12-u-confluence-com,auto-2026-10-22/14-u-co-computrabajo-com,auto-2026-10-22/15-u-nice-com,auto-2026-10-22/16-u-honda-com
    steps:
      - name: Run the handoff steps
        run: |
          if ! [[ "$START" =~ ^[1-8]$ ]]; then echo "::error::start is 1 to 8"; exit 1; fi
          # Dispatches one buffer-batch run and waits for it; buffer-batch runs one at a time (its concurrency group).
          dispatch() {
            local since id=""
            since=$(date -u +%FT%TZ)
            gh workflow run buffer-batch.yml "$@" || return 1
            for _ in $(seq 1 30); do
              sleep 10
              id=$(gh run list --workflow buffer-batch.yml --event workflow_dispatch -L 10 --json databaseId,createdAt \
                -q "[.[] | select(.createdAt >= \"$since\")] | last | .databaseId // empty")
              [ -n "$id" ] && break
            done
            [ -n "$id" ] || { echo "no run started for: $*"; return 1; }
            gh run watch "$id" -i 30 --exit-status > /dev/null
            local ok=$?
            echo "- $([ $ok = 0 ] && echo ok || echo FAILED) [run $id]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id): $*" | tee -a "$GITHUB_STEP_SUMMARY"
            return $ok
          }
          echo "### Dry runs" >> "$GITHUB_STEP_SUMMARY"
          bad=""
          for b in $BATCHES; do dispatch -f mode=queue -f batch="$b" -f dry_run=true || bad="$bad $b"; done
          dispatch -f mode=requeue -f posts="$POSTS" -f channel=youtube -f dry_run=true || bad="$bad requeue"
          if [ -n "$bad" ]; then echo "::error::Dry runs failed:$bad. Nothing live ran."; exit 1; fi

          echo "### Live steps" >> "$GITHUB_STEP_SUMMARY"
          step=0
          ran=""
          failed=""
          live() {
            step=$((step + 1))
            [ "$step" -lt "$START" ] && return 0
            [ -n "$ran" ] && sleep 900
            ran=1
            dispatch "$@" || failed="$failed $step"
          }
          for b in $BATCHES; do live -f mode=queue -f batch="$b" -f dry_run=false; done
          live -f mode=requeue -f posts="$POSTS" -f channel=youtube -f dry_run=false
          live -f mode=seed -f dry_run=false
          if [ -n "$failed" ]; then echo "::error::Live steps failed:$failed. Re-dispatch with start=<step> after checking the runs."; exit 1; fi
