# Name of the workflow
name: Lint Code Base

# Run this workflow on every push and pull request
on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write # This is the permission the linter needs to write a status check

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Fetch all history so changed-file linting can diff against the previous commit
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter@4e51915f4a812abf59fed160bb14595c0a38a9e7 # v6
        env:
          # v6 fatals unless this exact name is true or false. The old
          # VALIDATE_ALL_CODE_BASE spelling was ignored, so every run aborted.
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These either scan the whole tree or expect a style setup this site
          # does not have. Leaving them on fails the job before any useful check.
          VALIDATE_CHECKOV: false
          VALIDATE_CSS: false
          VALIDATE_EDITORCONFIG: false
          VALIDATE_GITLEAKS: false
          VALIDATE_GOOGLE_JAVA_FORMAT: false
          VALIDATE_HTML: false
          VALIDATE_JAVA: false
          # Jarvis Android: Compose functions are PascalCase, which ktlint's default rules reject; Gradle builds the code instead.
          VALIDATE_KOTLIN: false
          FILTER_REGEX_EXCLUDE: android/gradlew.*
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          # The cf CLI only reads cloudflare.config.ts (#1866); TypeScript Standard ran out of heap on it.
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_JSCPD: false
          VALIDATE_MARKDOWN: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_PYTHON: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_RUFF: false
