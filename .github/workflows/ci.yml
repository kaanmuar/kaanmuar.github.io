# .github/workflows/ci.yml
# Merges are gated by Lint Code, url-review-unit, and playwright (branch ruleset on main).
# Cypress and Robot fail their job when a case fails. Load and the native catalogs report but do not block a merge.
# The Cypress catalog runs on pushes to main and manual runs, not on pull requests.

name: E2E and Visual Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  url-review-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the critical CSS builder
        run: |
          read -ra deps <<<"$(node scripts/build-critical-css.js --deps)"
          npm install -s --no-save --prefix "$RUNNER_TEMP/critical-css" "${deps[@]}"
          echo "NODE_PATH=$RUNNER_TEMP/critical-css/node_modules" >> "$GITHUB_ENV"
      - name: URL review scoring, journeys, pricing, guards, and generated scripts
        run: npm run test:review
      - name: style.css matches input.css
        run: node scripts/build-style-css.js --check
      - name: Critical CSS matches the stylesheets
        run: node scripts/build-critical-css.js --check
      - name: Review language pages match their builder
        run: python3 scripts/build-review-langs.py --check
      - name: Social hub pages match their builder
        run: node scripts/build-social-hub.js --check
      - name: Jarvis rules in functions match the admin page
        run: node scripts/build-jarvis-core.js --check
      - name: Finding copy in functions matches the review pages
        run: node scripts/build-findings-copy.js --check

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --workers=4
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [catalog, cv, competency, lab]
    env:
      CYPRESS_SPECS: >-
        {"catalog": "cypress/e2e/catalog_spec.cy.js",
         "cv": "cypress/e2e/cv_spec.cy.js,cypress/e2e/admin_spec.cy.js",
         "competency": "cypress/e2e/competency_spec.cy.js,cypress/e2e/mobile_spec.cy.js,cypress/e2e/a11y_spec.cy.js",
         "lab": "cypress/e2e/qa_lab_spec.cy.js,cypress/e2e/security_spec.cy.js,cypress/e2e/simulator_spec.cy.js"}
    name: cypress (${{ matrix.group }})
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Cache Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Start static server
        run: |
          nohup python3 scripts/static-server.py 8765 > /tmp/static-server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8765/index.html > /dev/null && exit 0; sleep 1; done
          cat /tmp/static-server.log; exit 1
      - name: Run Cypress tests
        run: npx cypress run --spec "${{ fromJSON(env.CYPRESS_SPECS)[matrix.group] }}"
      - name: Upload Cypress report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cypress-${{ matrix.group }}
          path: |
            cypress/reports/html
            cypress/screenshots
          if-no-files-found: ignore

  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-robot.txt
      - name: Start static server
        run: |
          nohup python3 scripts/static-server.py 8765 > /tmp/static-server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8765/index.html > /dev/null && exit 0; sleep 1; done
          cat /tmp/static-server.log; exit 1
      - name: Run Robot Framework tests
        run: npm run test:robot
      - name: Upload Robot results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: robot-results
          path: robot-results
          if-no-files-found: ignore

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: Run k6 load tests
        run: npm run test:k6
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: gatling/pom.xml
      - name: Install JMeter
        run: |
          curl -fsSL -o /tmp/jmeter.tgz https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          sudo tar -xzf /tmp/jmeter.tgz -C /opt
          echo "/opt/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"
      - name: Run JMeter load tests
        run: npm run test:jmeter
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven
      - name: Run Gatling load tests
        run: npm run test:gatling

  catalog-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Install Firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
      - name: Selenium catalog on Chrome
        run: npm run test:selenium
        continue-on-error: true
      - name: Selenium catalog on Firefox
        run: TARGET_BROWSER=firefox npm run test:selenium
        continue-on-error: true
      - name: WebdriverIO catalog on Chrome
        run: npm run test:wdio
        continue-on-error: true
      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-catalog-results
          path: |
            wdio-results
            runner-results

  catalog-apple:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Selenium catalog on Safari
        run: TARGET_BROWSER=safari npm run test:selenium
        continue-on-error: true
      - name: Appium catalog on the first iPhone simulator
        run: |
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          DEVICE=$(node -e "const {listTargets}=require('./scripts/targets'); const phone=(listTargets().devices||[]).find(d=>d.platform==='ios'&&/iPhone/.test(d.name)); if(!phone){console.error('no iPhone simulator'); process.exit(1)}; process.stdout.write(JSON.stringify(phone));")
          APPIUM_DEVICE="$DEVICE" APPIUM_DEVICE_LABEL="$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write(d.label)' "$DEVICE")" npm run test:appium
        continue-on-error: true
      - name: Upload Apple results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-catalog-results
          path: |
            appium-results
            runner-results

  catalog-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Appium catalog on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          script: APPIUM_DEVICE='{"platform":"android","id":"emulator-5554","name":"emulator-5554","label":"Android emulator"}' npm run test:appium
        continue-on-error: true
