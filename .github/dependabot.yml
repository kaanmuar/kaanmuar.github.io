# .github/dependabot.yml
# Weekly version updates, with minor and patch bumps grouped into one PR per ecosystem; major bumps come one by one.
# Security updates are switched on in the repository settings and are not limited by these groups.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      site-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      functions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /gatling
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gatling-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Reddit's real CLI is `devvit@0.15.x`. npm also has an empty deprecated `devvit@1.0.0` stub from 2022;
  # Dependabot #3026 picked it and broke reddit-engagement / reddit-live (#3535).
  - package-ecosystem: npm
    directory: /reddit/live-reports
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "devvit"
        update-types: ["version-update:semver-major"]
    groups:
      reddit-live-reports-minor-patch:
        update-types: [minor, patch]
