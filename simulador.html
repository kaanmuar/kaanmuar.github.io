<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 24 · 4-Agent SDLC Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1220; --panel: #111827; --panel-2: #0f172a; --card: #1e293b;
            --line: #334155; --text: #e5eefc; --muted: #94a3b8; --blue: #3b82f6;
            --cyan: #22d3ee; --purple: #a78bfa; --green: #34d399; --amber: #fbbf24;
            --red: #f87171; --jira: #2684ff; --story: #63ba3c;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
        body { display: grid; grid-template-rows: 56px 1fr 150px; overflow: hidden; }
        button { font-family: inherit; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line); background: #0a1628; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
        .agents { display: flex; gap: 8px; flex-wrap: wrap; }
        .agent { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
        .agent.active { border-color: var(--purple); color: #fff; background: rgba(167,139,250,.15); }
        .agent.done { border-color: var(--green); color: var(--green); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .actions { display: flex; gap: 8px; }
        .btn { border: 0; border-radius: 6px; padding: 8px 12px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn-primary { background: var(--jira); color: #fff; }
        .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
        .btn-accept { background: #0f766e; color: #fff; }
        .btn-reject { background: transparent; color: var(--red); border: 1px solid var(--red); }
        .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
        .nav { border-right: 1px solid var(--line); background: var(--panel-2); padding: 14px 10px; }
        .nav button { width: 100%; text-align: left; background: transparent; border: 0; color: var(--muted); padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .nav button.active { background: #1e3a5f; color: #fff; }
        .workspace { min-width: 0; display: flex; flex-direction: column; }
        .phase-banner { padding: 10px 16px; border-bottom: 1px solid var(--line); background: #132033; font-size: 13px; color: var(--muted); }
        .phase-banner strong { color: var(--text); }
        .board { flex: 1; overflow: auto; padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
        .col { min-width: 250px; width: 250px; background: #0f172a; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
        .col h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
        .ticket { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
        .ticket:hover { border-color: var(--blue); }
        .ticket.pulse { outline: 2px solid var(--purple); transform: translateY(-2px); }
        .ticket.ok { border-color: var(--green); }
        .ticket.changed { border-color: var(--purple); }
        .ticket.kept { border-color: var(--amber); }
        .epic { font-size: 10px; font-weight: 700; color: var(--purple); text-transform: uppercase; }
        .sum { font-size: 13px; margin: 6px 0 8px; line-height: 1.35; }
        .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
        .prio { font-weight: 700; }
        .prio.highest { color: var(--red); } .prio.high { color: #fb7185; } .prio.medium { color: var(--amber); }
        .log { background: #020617; color: #86efac; font-family: 'Fira Code', monospace; font-size: 12px; padding: 10px 14px; overflow: auto; border-top: 1px solid var(--line); }
        .log b { color: var(--cyan); }
        .overlay { position: fixed; inset: 0; background: rgba(2,6,23,.72); display: none; z-index: 30; padding: 24px; }
        .overlay.show { display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
        .modal { width: min(1100px, 100%); background: #0f172a; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 40px; }
        .m-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .m-body { display: grid; grid-template-columns: 1.7fr .9fr; min-height: 520px; }
        .m-main { padding: 18px; overflow: auto; border-right: 1px solid var(--line); }
        .m-side { padding: 16px; background: #0b1524; }
        .tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--line); margin: 12px 0 16px; }
        .tabs button { background: none; border: 0; color: var(--muted); padding: 8px 0; cursor: pointer; font-size: 13px; }
        .tabs button.on { color: var(--jira); border-bottom: 2px solid var(--jira); font-weight: 600; }
        .field { display: grid; grid-template-columns: 110px 1fr; gap: 8px; font-size: 12px; margin-bottom: 8px; color: var(--muted); }
        .field b { color: var(--text); font-weight: 500; }
        .ac { background: #0b1220; border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre-wrap; font-family: 'Fira Code', monospace; font-size: 12px; line-height: 1.5; }
        .proposal { display: none; margin-top: 14px; border: 1px solid var(--purple); background: rgba(167,139,250,.08); border-radius: 8px; padding: 12px; }
        .proposal.show { display: block; }
        .row { display: flex; gap: 8px; margin-top: 10px; }
        .tests { padding: 16px; overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
        .gherkin { white-space: pre-wrap; font-family: 'Fira Code', monospace; font-size: 11px; color: #cbd5e1; background: #020617; padding: 8px; border-radius: 6px; }
        .code { white-space: pre-wrap; font-family: 'Fira Code', monospace; font-size: 11.5px; background: #020617; padding: 12px; border-radius: 8px; border: 1px solid var(--line); overflow: auto; max-height: 280px; }
        .pill { font-size: 10px; padding: 2px 6px; border-radius: 999px; border: 1px solid var(--line); }
        .pass { color: var(--green); } .fail { color: var(--red); }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
        .check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; font-size: 13px; }
        @media (max-width: 900px) {
            .shell { grid-template-columns: 1fr; }
            .nav { display: flex; overflow: auto; gap: 6px; border-right: 0; border-bottom: 1px solid var(--line); }
            .nav button { width: auto; white-space: nowrap; }
            .m-body { grid-template-columns: 1fr; }
            .agents { display: none; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="#2684FF"/><path d="M7 12l3 3 7-7" stroke="#fff" stroke-width="2"/></svg>
        <div>PayStream · QA Studio<small>Active sprint board · 4 specialized agents</small></div>
    </div>
    <div class="agents" id="agentPills"></div>
    <div class="actions">
        <button class="btn btn-ghost" id="resetBtn">Reset</button>
        <button class="btn btn-primary" id="runBtn">Run 4-agent sprint</button>
    </div>
</header>
<div class="shell">
    <aside class="nav" id="nav">
        <button data-view="board" class="active">Jira board</button>
        <button data-view="tests">Xray / TestRail</button>
        <button data-view="auto">Automation lab</button>
        <button data-view="verify">Sprint verification</button>
        <button data-view="report">Sprint report</button>
    </aside>
    <main class="workspace">
        <div class="phase-banner" id="banner">Explore the board, open any ticket, then start the four-agent sprint.</div>
        <div class="board" id="view"></div>
    </main>
</div>
<div class="log" id="log"><div><b>SYSTEM</b> Sprint 24 loaded. Four agents standing by.</div></div>

<div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
</div>

<script>
const AGENTS = [
    { id: 'a1', name: 'Ticket Steward', role: 'Reads & rewrites Jira stories' },
    { id: 'a2', name: 'Test Designer', role: 'Authors Gherkin and Xray cases' },
    { id: 'a3', name: 'Automation Engineer', role: 'Builds Playwright / Cypress / Robot' },
    { id: 'a4', name: 'Release Verifier', role: 'DoD, evidence, sprint sign-off' }
];

const TICKETS = [
    {
        key: 'PAY-241', type: 'Story', epic: 'Checkout integrity', column: 'To Do',
        summary: 'Enforce 3-D Secure challenge on high-risk checkout',
        priority: 'Highest', points: 8, assignee: 'CM', assigneeName: 'Carlos Muñoz', reporter: 'Priya Shah',
        labels: ['security', 'payments', 'pci'], components: ['Checkout API', 'Risk Engine'],
        env: 'staging-eu-1 · feature/3ds-challenge', sprint: 'Sprint 24',
        description: `As a payments risk owner, I want high-risk card checkouts to complete a 3-D Secure challenge so that we reduce CNP fraud without blocking low-risk returning customers.

Business context
PayStream processes ~1.2M checkouts/day. Risk score ≥ 72 must step up to 3DS 2.2. Low-risk wallets (Apple Pay / Google Pay) are out of scope.

Technical notes
- Risk payload is produced by Risk Engine v4 (\`riskScore\`, \`reasonCodes\`).
- ACS redirect must preserve the original order UUID.
- Time-box the challenge to 8 minutes; after expiry the authorization is voided.`,
        ac: `- 3DS is shown for risky payments
- User can pay after challenge
- Errors are handled`,
        proposedAc: `Scenario: High-risk card requires 3DS
  Given a guest checkout with riskScore 81 and reasonCodes ["velocity","geo-mismatch"]
  And the card is Visa ending 4242
  When the shopper submits payment
  Then the order remains in status PENDING_3DS
  And the shopper is redirected to the ACS URL within 2s
  And the original order UUID is forwarded as threeDSRequestorTransID

Scenario: Successful challenge authorizes the order
  Given a PENDING_3DS order
  When the ACS returns transStatus "Y"
  Then authorization is requested with ECI 05
  And the order moves to AUTHORIZED
  And the shopper sees confirmation PAY-241-OK

Scenario: Challenge timeout voids the hold
  Given a PENDING_3DS order older than 8 minutes
  When the shopper has not completed ACS
  Then the authorization hold is voided
  And the order moves to EXPIRED_3DS
  And analytics event checkout.3ds.timeout is emitted`,
        comments: [
            { who: 'Priya Shah · PO', when: '22 Sep 09:14', text: 'Legal requires we keep the raw ACS payload 90 days for chargebacks.' },
            { who: 'Luis Ortega · Risk', when: '22 Sep 11:02', text: 'Please do not step-up Apple Pay; false positives spiked last quarter.' }
        ],
        links: ['PAY-198 Implement Risk Engine v4', 'SEC-44 Store ACS payloads'],
        attachments: ['3ds-sequence.png', 'risk-matrix-v4.xlsx'],
        findings: 'Acceptance criteria are not testable: no risk threshold, no timeout, no ACS transStatus mapping.',
        tests: [
            { id: 'XT-1101', title: 'High-risk Visa is challenged', priority: 'Critical', est: '40m', include: true, gherkin: 'Feature: 3DS step-up\n  Scenario: High-risk card requires 3DS\n    Given riskScore 81\n    When payment is submitted\n    Then order is PENDING_3DS' },
            { id: 'XT-1102', title: 'Successful ACS authorizes order', priority: 'Critical', est: '35m', include: true, gherkin: 'Scenario: ACS Y authorizes\n    Given PENDING_3DS order\n    When transStatus is Y\n    Then order is AUTHORIZED' },
            { id: 'XT-1103', title: 'Timeout voids authorization hold', priority: 'High', est: '30m', include: true, gherkin: 'Scenario: 8 minute timeout\n    Given PENDING_3DS older than 8m\n    Then order is EXPIRED_3DS' },
            { id: 'XT-1104', title: 'Apple Pay is never stepped up', priority: 'High', est: '20m', include: false, gherkin: 'Scenario: Wallet exemption\n    Given Apple Pay token\n    When riskScore is 90\n    Then no ACS redirect occurs' }
        ]
    },
    {
        key: 'PAY-246', type: 'Story', epic: 'Checkout integrity', column: 'In Progress',
        summary: 'Idempotent capture API for duplicate webhook retries',
        priority: 'High', points: 5, assignee: 'DA', assigneeName: 'Dana Alves', reporter: 'Carlos Muñoz',
        labels: ['api', 'reliability'], components: ['Payments API'],
        env: 'staging-us-2 · feature/idempotent-capture', sprint: 'Sprint 24',
        description: `As a platform engineer, I want capture requests to be idempotent on Idempotency-Key so Stripe-style webhook retries do not double-capture a customer.

Current defect
Ops saw 17 double-captures last week when the PSP retried /v2/captures with the same body after a 504.`,
        ac: `API should not charge twice. Use a header.`,
        proposedAc: `Scenario: Same Idempotency-Key returns original capture
  Given capture CAP-88 already succeeded for order ORD-9
  When POST /v2/captures is retried with Idempotency-Key "cap-88-a"
  Then HTTP 200 is returned
  And body.captureId is CAP-88
  And the card network is not contacted a second time
  And metric payments.capture.idempotent_hit increments

Scenario: Missing key is rejected
  Given a capture request without Idempotency-Key
  When POST /v2/captures is called
  Then HTTP 400 with code IDEMPOTENCY_KEY_REQUIRED is returned`,
        comments: [{ who: 'SRE Bot', when: '21 Sep 18:40', text: 'PagerDuty: duplicate capture on merchant 4412.' }],
        links: ['INC-902 Double capture'],
        attachments: ['webhook-retry.har'],
        findings: 'No HTTP contract, no header name, no metric. Cannot automate as written.',
        tests: [
            { id: 'XT-1201', title: 'Retry with same key is idempotent', priority: 'Critical', est: '30m', include: true, gherkin: 'Scenario: Idempotent retry\n  Given capture CAP-88 exists\n  When retried with same key\n  Then captureId stays CAP-88' },
            { id: 'XT-1202', title: 'Missing Idempotency-Key → 400', priority: 'High', est: '15m', include: true, gherkin: 'Scenario: Missing key\n  When POST /v2/captures has no header\n  Then status is 400' }
        ]
    },
    {
        key: 'PAY-251', type: 'Bug', epic: 'Wallet UX', column: 'In Review',
        summary: 'Saved card CVV modal not announced to screen readers',
        priority: 'High', points: 3, assignee: 'KB', assigneeName: 'Kim Brooks', reporter: 'A11y Guild',
        labels: ['a11y', 'wcag'], components: ['Web Checkout'],
        env: 'chrome/voiceover · production replica', sprint: 'Sprint 24',
        description: `NVDA and VoiceOver skip the CVV dialog when a returning shopper pays with a saved card. WCAG 2.2 4.1.2 / 2.4.3 fail. Legal deadline: this sprint.`,
        ac: `Make it accessible.`,
        proposedAc: `Scenario: CVV dialog is announced
  Given a returning shopper with a saved Visa
  When they choose Pay
  Then a modal dialog is opened with role="dialog" and aria-modal="true"
  And focus moves to the CVV input
  And the accessible name is "Enter CVV for card ending 4242"

Scenario: Escape returns focus to Pay
  Given the CVV dialog is open
  When the shopper presses Escape
  Then the dialog closes
  And focus returns to the Pay button`,
        comments: [{ who: 'A11y Guild', when: '20 Sep 16:11', text: 'Severity 2. Blocking App Store accessibility review.' }],
        links: ['A11Y-12 Checkout audit'],
        attachments: ['voiceover-fail.mp4'],
        findings: '"Make it accessible" is not a criterion. Need roles, focus trap, accessible name.',
        tests: [
            { id: 'XT-1301', title: 'Dialog role and focus move', priority: 'Critical', est: '25m', include: true, gherkin: 'Scenario: Dialog announced\n  When Pay is chosen\n  Then role=dialog is present and focused' },
            { id: 'XT-1302', title: 'Escape restores Pay focus', priority: 'High', est: '15m', include: true, gherkin: 'Scenario: Escape\n  Given dialog open\n  When Escape\n  Then Pay button is focused' }
        ]
    },
    {
        key: 'PAY-255', type: 'Story', epic: 'Ledger', column: 'To Do',
        summary: 'Daily settlement file to merchant SFTP with SHA-256 manifest',
        priority: 'Medium', points: 5, assignee: 'JW', assigneeName: 'Jordan White', reporter: 'Finance Ops',
        labels: ['batch', 'sftp'], components: ['Settlements'],
        env: 'batch-worker · sftp.paystream.internal', sprint: 'Sprint 24',
        description: `Finance needs a 02:15 UTC settlements CSV plus SHA-256 sidecar so merchants can reconcile before banking cut-off.`,
        ac: `File is generated and uploaded. Checksum exists.`,
        proposedAc: `Scenario: File lands before cut-off
  Given 12 AUTHORIZED captures for merchant M-44 on 23 Sep UTC
  When the 02:15 job runs
  Then sftp://settle/M-44/2026-09-23.csv contains 12 data rows
  And 2026-09-23.csv.sha256 matches the file digest
  And job finishes before 02:25 UTC
  And Datadog check settlement.sftp.success is OK`,
        comments: [{ who: 'Finance Ops', when: '19 Sep 08:02', text: 'Please keep UTF-8 and semicolon delimiter — EU merchants.' }],
        links: ['FIN-77 Recon SLA'],
        attachments: ['sample-settlement.csv'],
        findings: 'No row count, encoding, SLA, or monitoring assertion.',
        tests: [
            { id: 'XT-1401', title: 'CSV row count matches captures', priority: 'High', est: '35m', include: true, gherkin: 'Scenario: Row count\n  Given 12 captures\n  Then CSV has 12 rows' },
            { id: 'XT-1402', title: 'SHA-256 sidecar matches', priority: 'High', est: '20m', include: false, gherkin: 'Scenario: Manifest\n  Then sha256 sidecar matches digest' }
        ]
    }
];

const state = {
    view: 'board',
    tickets: TICKETS.map(t => ({ ...t, decision: null, tests: t.tests.map(x => ({ ...x })) })),
    agent: null,
    running: false,
    results: [],
    verify: { ac: false, auto: false, sev: false, notes: false }
};

const viewEl = document.getElementById('view');
const logEl = document.getElementById('log');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const banner = document.getElementById('banner');
let gate = null;

function log(src, msg) {
    const line = document.createElement('div');
    line.innerHTML = `<b>${src}</b> ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
}
function waitUser() { return new Promise(res => { gate = res; }); }
function resume(v) { if (gate) { const g = gate; gate = null; g(v); } }

function renderAgents() {
    document.getElementById('agentPills').innerHTML = AGENTS.map(a => {
        const cls = state.agent === a.id ? 'active' : (agentDone(a.id) ? 'done' : '');
        return `<div class="agent ${cls}"><span class="dot"></span>${a.name}</div>`;
    }).join('');
}
function agentDone(id) {
    if (id === 'a1') return state.tickets.every(t => t.decision);
    if (id === 'a2') return state.tickets.some(t => t.tests.some(x => x.reviewed));
    if (id === 'a3') return state.results.length > 0;
    if (id === 'a4') return Object.values(state.verify).every(Boolean);
    return false;
}

function setView(name) {
    state.view = name;
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
    if (name === 'board') renderBoard();
    if (name === 'tests') renderTests();
    if (name === 'auto') renderAuto();
    if (name === 'verify') renderVerify();
    if (name === 'report') renderReport();
}

function columns() {
    return ['To Do', 'In Progress', 'In Review', 'Ready for QA', 'Done'];
}

function renderBoard() {
    const cols = columns().map(c => {
        const cards = state.tickets.filter(t => t.column === c).map(ticketCard).join('');
        return `<div class="col"><h3>${c} · ${state.tickets.filter(t => t.column === c).length}</h3>${cards || '<div class="sum" style="color:var(--muted)">Empty</div>'}</div>`;
    }).join('');
    viewEl.innerHTML = cols;
    viewEl.className = 'board';
}

function ticketCard(t) {
    const cls = t.decision === 'accept' ? 'changed' : t.decision === 'keep' ? 'kept' : t.decision === 'ok' ? 'ok' : '';
    return `<article class="ticket ${cls}" id="card-${t.key}" onclick="openTicket('${t.key}')">
        <div class="epic">${t.epic} · ${t.type}</div>
        <div class="sum">${t.summary}</div>
        <div class="meta"><span>${t.key}</span><span class="prio ${t.priority.toLowerCase()}">${t.priority} · ${t.points} SP</span></div>
    </article>`;
}

function openTicket(key, opts = {}) {
    const t = state.tickets.find(x => x.key === key);
    const ac = t.decision === 'accept' ? t.proposedAc : t.ac;
    modal.innerHTML = `
        <div class="m-head">
            <div><span class="pill">${t.type}</span> <strong>${t.key}</strong> · ${t.sprint}</div>
            <button class="btn btn-ghost" onclick="closeModal()">Close</button>
        </div>
        <div class="m-body">
            <div class="m-main">
                <h2 style="margin:0 0 6px;font-size:22px">${t.summary}</h2>
                <div class="tabs">
                    <button class="on" data-tab="desc">Description</button>
                    <button data-tab="ac">Acceptance</button>
                    <button data-tab="res">Resources</button>
                    <button data-tab="act">Activity</button>
                </div>
                <div id="tab-desc">
                    <p style="white-space:pre-wrap;line-height:1.55">${t.description}</p>
                </div>
                <div id="tab-ac" hidden>
                    <div class="ac" id="acBox">${escapeHtml(ac)}</div>
                    <div class="proposal ${opts.propose ? 'show' : ''}" id="proposal">
                        <strong>Agent 1 · Ticket Steward</strong>
                        <p>${t.findings}</p>
                        <div class="ac">${escapeHtml(t.proposedAc)}</div>
                        <div class="row">
                            <button class="btn btn-accept" onclick="resume('accept')">Accept rewrite</button>
                            <button class="btn btn-reject" onclick="resume('keep')">Keep original</button>
                        </div>
                    </div>
                </div>
                <div id="tab-res" hidden>
                    <p><strong>Attachments</strong></p>
                    ${t.attachments.map(a => `<div class="card" style="margin-bottom:8px">📎 ${a} · click-through demo resource</div>`).join('')}
                    <p><strong>Linked work</strong></p>
                    ${t.links.map(a => `<div class="linked">${a}</div>`).join('')}
                </div>
                <div id="tab-act" hidden>
                    ${t.comments.map(c => `<div class="card" style="margin-bottom:8px"><b>${c.who}</b> · ${c.when}<div>${c.text}</div></div>`).join('')}
                </div>
            </div>
            <aside class="m-side">
                <div class="field"><span>Status</span><b>${t.column}</b></div>
                <div class="field"><span>Assignee</span><b>${t.assigneeName}</b></div>
                <div class="field"><span>Reporter</span><b>${t.reporter}</b></div>
                <div class="field"><span>Priority</span><b class="prio ${t.priority.toLowerCase()}">${t.priority}</b></div>
                <div class="field"><span>Story points</span><b>${t.points}</b></div>
                <div class="field"><span>Sprint</span><b>${t.sprint}</b></div>
                <div class="field"><span>Components</span><b>${t.components.join(', ')}</b></div>
                <div class="field"><span>Labels</span><b>${t.labels.join(', ')}</b></div>
                <div class="field"><span>Environment</span><b>${t.env}</b></div>
                <div class="field"><span>Linked tests</span><b>${t.tests.length} Xray cases</b></div>
            </aside>
        </div>`;
    overlay.classList.add('show');
    modal.querySelectorAll('.tabs button').forEach(btn => btn.onclick = () => {
        modal.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        ['desc','ac','res','act'].forEach(id => document.getElementById('tab-' + id).hidden = btn.dataset.tab !== id);
    });
    if (opts.propose) {
        modal.querySelector('[data-tab="ac"]').click();
    }
}

function closeModal() { overlay.classList.remove('show'); }

function escapeHtml(s) {
    return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function renderTests() {
    viewEl.className = 'tests';
    const rows = state.tickets.flatMap(t => t.tests.map(tc => `
        <tr>
            <td><input type="checkbox" ${tc.include ? 'checked' : ''} onchange="toggleCase('${t.key}','${tc.id}', this.checked)"></td>
            <td>${tc.id}<div class="muted">${t.key}</div></td>
            <td>${tc.title}<div class="gherkin">${escapeHtml(tc.gherkin)}</div></td>
            <td>${tc.priority}</td>
            <td>${tc.est}</td>
            <td>${tc.include ? 'Sprint 24' : 'Backlog'}</td>
        </tr>`)).join('');
    viewEl.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div><h2 style="margin:0">Xray repository</h2><div style="color:var(--muted);font-size:13px">Gherkin cases linked to Jira stories · select the sprint set</div></div>
            <button class="btn btn-accept" id="approveTests">Approve sprint test set</button>
        </div>
        <table>
            <thead><tr><th>In sprint</th><th>Key</th><th>Case / Gherkin</th><th>Priority</th><th>Est.</th><th>Folder</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
    document.getElementById('approveTests').onclick = () => {
        state.tickets.forEach(t => t.tests.forEach(tc => { tc.reviewed = true; }));
        log('A2', 'Sprint test set approved by user.');
        resume(true);
        renderAgents();
    };
}
function toggleCase(ticket, id, on) {
    const tc = state.tickets.find(t => t.key === ticket).tests.find(x => x.id === id);
    tc.include = on;
}

function snippets(tc) {
    return {
        playwright: `import { test, expect } from '@playwright/test';\n\ntest('${tc.id} ${tc.title}', async ({ request, page }) => {\n  // Generated from ${tc.id}\n  const res = await request.post('/v2/simulate');\n  expect(res.ok()).toBeTruthy();\n});`,
        cypress: `describe('${tc.id}', () => {\n  it('${tc.title}', () => {\n    cy.api('POST', '/v2/simulate').its('status').should('eq', 200);\n  });\n});`,
        robot: `*** Test Cases ***\n${tc.id} ${tc.title}\n    \${resp}=    POST    /v2/simulate\n    Status Should Be    200    \${resp}`
    };
}

function renderAuto() {
    viewEl.className = 'tests';
    const selected = state.tickets.flatMap(t => t.tests.filter(tc => tc.include));
    const first = selected[0];
    const sn = first ? snippets(first) : { playwright: '// no cases selected', cypress: '', robot: '' };
    const resultRows = state.results.map(r => `<tr><td>${r.id}</td><td>${r.fw}</td><td class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASSED' : 'FAILED'}</td><td>${r.ms} ms</td></tr>`).join('');
    viewEl.innerHTML = `
        <h2 style="margin-top:0">Automation lab</h2>
        <p style="color:var(--muted)">${selected.length} cases in the sprint set · frameworks: Playwright, Cypress, Robot Framework</p>
        <div class="grid2">
            <div class="card"><h3>Playwright</h3><div class="code">${escapeHtml(sn.playwright)}</div></div>
            <div class="card"><h3>Cypress</h3><div class="code">${escapeHtml(sn.cypress)}</div></div>
        </div>
        <div class="card" style="margin-top:12px"><h3>Robot Framework</h3><div class="code">${escapeHtml(sn.robot)}</div></div>
        <h3>Last run</h3>
        <table><thead><tr><th>Case</th><th>Framework</th><th>Result</th><th>Duration</th></tr></thead><tbody>${resultRows || '<tr><td colspan="4">No run yet</td></tr>'}</tbody></table>`;
}

function renderVerify() {
    viewEl.className = 'tests';
    const v = state.verify;
    viewEl.innerHTML = `
        <h2 style="margin-top:0">Sprint verification · Agent 4</h2>
        <p style="color:var(--muted)">Definition of Done evidence before increment sign-off.</p>
        <div class="card">
            <label class="check"><input type="checkbox" ${v.ac ? 'checked' : ''} onchange="state.verify.ac=this.checked"> All sprint stories have testable acceptance criteria (post Agent 1).</label>
            <label class="check"><input type="checkbox" ${v.auto ? 'checked' : ''} onchange="state.verify.auto=this.checked"> Selected Xray cases have automation results in Playwright, Cypress and Robot.</label>
            <label class="check"><input type="checkbox" ${v.sev ? 'checked' : ''} onchange="state.verify.sev=this.checked"> No Sev-1 defects remain in Ready for QA / Done.</label>
            <label class="check"><input type="checkbox" ${v.notes ? 'checked' : ''} onchange="state.verify.notes=this.checked"> Release notes + 3DS / capture / a11y evidence attached.</label>
            <div class="row"><button class="btn btn-accept" onclick="signOff()">Sign off increment</button></div>
        </div>`;
}

function signOff() {
    if (!Object.values(state.verify).every(Boolean)) {
        log('A4', 'Sign-off blocked: complete every verification checkbox.');
        return;
    }
    log('A4', 'Increment signed off for Sprint 24.');
    resume(true);
    setView('report');
}

function renderReport() {
    viewEl.className = 'tests';
    const accepted = state.tickets.filter(t => t.decision === 'accept').length;
    const kept = state.tickets.filter(t => t.decision === 'keep' || t.decision === 'ok').length;
    const cases = state.tickets.flatMap(t => t.tests);
    const inSprint = cases.filter(t => t.include).length;
    const passed = state.results.filter(r => r.ok).length;
    viewEl.innerHTML = `
        <h2 style="margin-top:0">Sprint 24 report</h2>
        <div class="grid2">
            <div class="card"><h3>Agent 1 · Stories</h3><p>${accepted} rewritten · ${kept} kept as-is · ${state.tickets.length} total</p></div>
            <div class="card"><h3>Agent 2 · Xray</h3><p>${inSprint} of ${cases.length} cases selected for the sprint</p></div>
            <div class="card"><h3>Agent 3 · Automation</h3><p>${passed}/${state.results.length} scripted runs passed</p></div>
            <div class="card"><h3>Agent 4 · Verification</h3><p>${Object.values(state.verify).every(Boolean) ? 'Increment signed off' : 'Pending sign-off'}</p></div>
        </div>
        <p style="color:var(--muted)">This studio is a live CV demo of how specialized agents collaborate on a real Scrum increment: refine Jira, curate Xray, generate automation, then verify the DoD.</p>`;
}

async function runSprint() {
    if (state.running) return;
    state.running = true;
    document.getElementById('runBtn').disabled = true;
    closeModal();
    setView('board');

    state.agent = 'a1'; renderAgents();
    banner.innerHTML = '<strong>Agent 1 · Ticket Steward</strong> — reading each Jira issue like a BA/QA pair, proposing testable AC. You decide.';
    log('A1', 'Scanning Sprint 24 stories for testability gaps.');
    for (const t of state.tickets) {
        const el = document.getElementById('card-' + t.key);
        if (el) { el.classList.add('pulse'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        log('A1', `${t.key}: ${t.findings}`);
        await sleep(500);
        openTicket(t.key, { propose: true });
        const decision = await waitUser();
        t.decision = decision === 'accept' ? 'accept' : 'keep';
        if (decision === 'accept') {
            t.ac = t.proposedAc;
            log('USER', `${t.key} rewrite accepted. AC replaced with Gherkin-ready criteria.`);
        } else {
            log('USER', `${t.key} original AC kept.`);
        }
        t.column = 'Ready for QA';
        closeModal();
        renderBoard();
        await sleep(250);
    }
    renderAgents();

    state.agent = 'a2'; renderAgents();
    banner.innerHTML = '<strong>Agent 2 · Test Designer</strong> — Xray/TestRail view. Uncheck cases that should stay in the repo backlog, then approve.';
    setView('tests');
    log('A2', 'Generated Gherkin cases and linked them to Jira keys.');
    await waitUser();
    state.tickets.forEach(t => t.tests.forEach(tc => { if (tc.include) t.column = 'Ready for QA'; }));
    renderAgents();

    state.agent = 'a3'; renderAgents();
    banner.innerHTML = '<strong>Agent 3 · Automation Engineer</strong> — generating Playwright, Cypress and Robot scripts, then executing the sprint set.';
    setView('auto');
    const selected = state.tickets.flatMap(t => t.tests.filter(tc => tc.include));
    const frameworks = ['Playwright', 'Cypress', 'Robot'];
    state.results = [];
    for (const tc of selected) {
        const fw = frameworks[state.results.length % 3];
        log('A3', `Generating ${fw} spec for ${tc.id}…`);
        await sleep(350);
        const ok = !(tc.id === 'XT-1401' && fw === 'Robot'); // one scripted flake for realism
        const ms = 420 + Math.floor(Math.random() * 900);
        state.results.push({ id: tc.id, fw, ok, ms });
        log('A3', ok ? `${tc.id} [${fw}] PASSED (${ms} ms)` : `${tc.id} [${fw}] FAILED · retry queued`);
        renderAuto();
        await sleep(200);
    }
    log('A3', 'Run complete. Report attached to the sprint.');
    renderAgents();

    state.agent = 'a4'; renderAgents();
    banner.innerHTML = '<strong>Agent 4 · Release Verifier</strong> — walk the Definition of Done. Tick every control, then sign off.';
    setView('verify');
    log('A4', 'Waiting for human verification of DoD evidence.');
    await waitUser();
    state.tickets.forEach(t => { if (t.tests.some(tc => tc.include)) t.column = 'Done'; });
    banner.innerHTML = '<strong>Sprint 24 complete.</strong> Review the report or reset to run again.';
    state.running = false;
    document.getElementById('runBtn').disabled = false;
    renderAgents();
    renderBoard();
    setView('report');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

document.getElementById('nav').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; setView(b.dataset.view);
});
document.getElementById('runBtn').onclick = runSprint;
document.getElementById('resetBtn').onclick = () => location.reload();
overlay.addEventListener('click', e => { if (e.target === overlay && !state.running) closeModal(); });

renderAgents();
setView('board');
</script>
</body>
</html>
