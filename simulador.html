        * { box-sizing: border-box; }

        .agents { display: flex; gap: 8px; flex-wrap: wrap; }
        .agent { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }

        .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn-primary { background: var(--jira); color: #fff; }
        .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
        .btn-accept { background: #0f766e; color: #fff; }
        .btn-reject { background: transparent; color: var(--red); border: 1px solid var(--red); }

        .nav { border-right: 1px solid var(--line); background: var(--panel-2); padding: 14px 10px; }
        .nav button, .nav a { width: 100%; text-align: left; background: transparent; border: 0; color: var(--muted); padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; display: block; text-decoration: none; }

        .workspace { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

        .phase-banner strong { color: var(--text); }
        .board { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
        .col { min-width: 250px; width: 250px; background: var(--col); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
        .col h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
        .ticket-wrap { margin-bottom: 8px; }
        .ticket { position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
        .ticket:hover { border-color: var(--blue); }
        .ticket.pulse { outline: 2px solid var(--purple); transform: translateY(-2px); }
        .ticket-wrap.active-review .ticket { border-color: var(--cyan); border-radius: 8px 8px 0 0; outline: 1px solid rgba(77,179,187,.45); }
        .laser {
            pointer-events: none;
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 12px;
            margin-left: -6px;
            background: linear-gradient(180deg, transparent 0%, #0d6e76 18%, var(--laser-mid) 50%, #4db3bb 82%, transparent 100%);
            box-shadow: 0 0 14px 4px rgba(13,110,118,.75), 0 0 36px 10px rgba(77,179,187,.28);
            opacity: 0;
            z-index: 3;
        }
        .scanning > .laser { animation: laserSweep var(--scan-ms, 1.7s) linear 1; }
        @keyframes laserSweep {
            0% { left: 0; opacity: 0; }
            8% { opacity: 1; }
            92% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }
        .ticket-console, .agent-console {
            display: none;
            background: var(--console);
            border: 1px solid var(--console-border);
            color: var(--console-text);
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            line-height: 1.45;
            padding: 8px 10px;
            max-height: 128px;
            overflow: auto;
        }
        .ticket-console { border-top: 0; border-radius: 0 0 8px 8px; }
        .ticket-wrap.active-review .ticket-console { display: block; }
        .agent-console { display: block; border-radius: 0 0 10px 10px; border-top: 1px solid var(--console-border); max-height: 150px; }
        .agent-console .k, .ticket-console .k { color: var(--amber); }
        .agent-console .ok, .ticket-console .ok { color: var(--green); }
        .agent-console .dec, .ticket-console .dec { color: var(--purple); }
        .scan-stage { position: relative; overflow: hidden; }
        .phase-console {
            display: none;
            flex: 0 0 auto;
            max-height: 132px;
            overflow: auto;
            background: var(--console);
            border-top: 1px solid var(--console-border);
            color: var(--console-text);
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            line-height: 1.45;
            padding: 8px 12px;
        }
        .phase-console.show { display: block; }
        .phase-console .k { color: var(--amber); }
        .phase-console .ok { color: var(--green); }
        .phase-console .dec { color: var(--purple); }
        .handoff {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
            position: relative;
            z-index: 2;
        }
        .handoff .btn { white-space: nowrap; flex: 0 0 auto; }
        .ticket.ok { border-color: var(--green); }
        .ticket.changed { border-color: var(--purple); }
        .ticket.kept { border-color: var(--amber); }
        .epic { font-size: 10px; font-weight: 700; color: var(--purple); text-transform: uppercase; }
        .sum { font-size: 13px; margin: 6px 0 8px; line-height: 1.35; }
        .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
        .prio { font-weight: 700; }
        .prio.highest { color: var(--red); } .prio.high { color: #fb7185; } .prio.medium { color: var(--amber); }
        .log { background: var(--log-bg); color: var(--log-text); font-family: 'Fira Code', monospace; font-size: 12px; padding: 10px 14px; overflow: auto; border-top: 1px solid var(--line); min-height: 0; }
        .log b { color: var(--cyan); }
        .overlay { position: fixed; inset: 0; background: var(--overlay); display: none; z-index: 30; padding: 24px; }
        .overlay.show { display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
        .modal { width: min(1100px, 100%); background: var(--modal); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 40px; }
        .m-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .m-body { display: grid; grid-template-columns: 1.7fr .9fr; min-height: 520px; }
        .m-main { padding: 18px; overflow: auto; border-right: 1px solid var(--line); }
        .m-side { padding: 16px; background: var(--modal-side); }
        .tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--line); margin: 12px 0 16px; }
        .tabs button { background: none; border: 0; color: var(--muted); padding: 8px 0; cursor: pointer; font-size: 13px; }
        .tabs button.on { color: var(--jira); border-bottom: 2px solid var(--jira); font-weight: 600; }
        .field { display: grid; grid-template-columns: 110px 1fr; gap: 8px; font-size: 12px; margin-bottom: 8px; color: var(--muted); }
        .field b { color: var(--text); font-weight: 500; }
        .ac { background: var(--console); border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre-wrap; font-family: 'Fira Code', monospace; font-size: 12px; line-height: 1.5; color: var(--console-text); }
        .proposal { display: none; margin-top: 14px; border: 1px solid var(--purple); background: rgba(167,139,250,.08); border-radius: 8px; padding: 12px; }
        .proposal.show { display: block; }
        .row { display: flex; gap: 8px; margin-top: 10px; }
        .tests { flex: 1; min-height: 0; padding: 16px; overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
        .gherkin { white-space: pre-wrap; font-family: 'Fira Code', monospace; font-size: 11px; color: var(--code-text); background: var(--console); padding: 8px; border-radius: 6px; }
        .code { white-space: pre-wrap; font-family: 'Fira Code', monospace; font-size: 11.5px; background: var(--console); color: var(--code-text); padding: 12px; border-radius: 8px; border: 1px solid var(--line); overflow: auto; max-height: 280px; }
        .pill { font-size: 10px; padding: 2px 6px; border-radius: 999px; border: 1px solid var(--line); }
        .pass { color: var(--green); } .fail { color: var(--red); }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
        .check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; font-size: 13px; }
        .lang-wrap { position: relative; }
        .lang-toggle { display: flex; align-items: center; gap: 4px; background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
        .lang-toggle img { width: 18px; height: 18px; border-radius: 50%; }
        .lang-menu { display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: 15rem; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; flex-direction: column; gap: 8px; }
        .lang-wrap.open .lang-menu { display: flex; }
        .lang-search { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
        .lang-options-list { display: flex; flex-direction: column; gap: 4px; max-height: calc(6 * 1.75rem + 5 * 0.25rem); overflow-y: auto; }

        .lang-option:hover { background: var(--card); }
        .lang-option img { width: 18px; height: 18px; border-radius: 50%; }
        #google_translate_element, .goog-te-banner-frame, .goog-te-balloon-frame, #goog-gt-tt, iframe.skiptranslate, .goog-te-gadget { display: none !important; visibility: hidden !important; height: 0 !important; }
        html, body { top: 0 !important; position: static !important; }
        @media (max-width: 900px) {
            html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
            body { display: flex; flex-direction: column; }
            .topbar { flex-direction: column; align-items: stretch; gap: 10px; }
            .brand { min-width: 0; }
            .brand small { white-space: normal; }
            .actions { width: 100%; }
            #runBtn { flex: 1 1 auto; }
            .shell { grid-template-columns: 1fr; min-height: 55vh; }
            .nav { display: flex; overflow: auto; gap: 6px; border-right: 0; border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
            .nav button, .nav a { width: auto; white-space: nowrap; }
            .board { -webkit-overflow-scrolling: touch; }
            .col { min-width: min(250px, 82vw); width: min(250px, 82vw); }
            .log { max-height: 28vh; min-height: 80px; }
            .overlay { padding: 10px; }
            .m-body { grid-template-columns: 1fr; min-height: 0; }
            .m-main { border-right: 0; }
            .grid2 { grid-template-columns: 1fr; }
            .field { grid-template-columns: 1fr; }
            .handoff { flex-direction: column; align-items: stretch; }
            .handoff .btn { width: 100%; }
            .agents { display: none; }
            .lang-menu { width: min(15rem, calc(100vw - 24px)); }
        }
    </style>

    <script>
const AGENTS = [
    { id: 'a1', name: 'Ticket Steward', role: 'Reads & rewrites Jira stories' },

let gate = null;

function track(eventName, category, label, extra) {
    if (window.SiteAnalytics) SiteAnalytics.event(eventName, category, label, extra);
    else if (typeof gtag === 'function') gtag('event', eventName, Object.assign({ event_category: category, event_label: label }, extra || {}));
}

function log(src, msg) {
    const line = document.createElement('div');
    line.innerHTML = `<b>${src}</b> ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
}
function waitUser() { return new Promise(res => { gate = res; }); }
function resume(v) { if (gate) { const g = gate; gate = null; g(v); } }

function renderAgents() {
    document.getElementById('agentPills').innerHTML = AGENTS.map(a => {
        const cls = state.agent === a.id ? 'active' : (agentDone(a.id) ? 'done' : '');
        return `<div class="agent ${cls}"><span class="dot"></span>${a.name}</div>`;
    }).join('');
}
function agentDone(id) {
    if (id === 'a1') return state.tickets.every(t => t.decision);
    if (id === 'a2') return state.tickets.some(t => t.tests.some(x => x.reviewed));
    if (id === 'a3') return state.results.length > 0;
    if (id === 'a4') return Object.values(state.verify).every(Boolean);
    return false;
}

function setView(name) {
    const previous = state.view;
    state.view = name;
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
    if (name === 'board') renderBoard();
    if (name === 'tests') renderTests();
    if (name === 'auto') renderAuto();
    if (name === 'verify') renderVerify();
    if (name === 'report') renderReport();
    if (window.SiteI18n) SiteI18n.refreshTranslation();
    if (previous !== name) track('sim_view', 'Simulator', name, { previous_view: previous });
}

function columns() {

function renderBoard() {

function ticketCard(t) {
    const cls = t.decision === 'accept' ? 'changed' : t.decision === 'keep' ? 'kept' : t.decision === 'ok' ? 'ok' : '';
    return `<div class="ticket-wrap" id="wrap-${t.key}">
        <article class="ticket ${cls}" id="card-${t.key}" onclick="openTicket('${t.key}')">
            <div class="laser"></div>

        </article>
        <div class="ticket-console" id="console-${t.key}"></div>
    </div>`;
}

function ensureLaser(el) {
    if (!el) return;
    if (!el.querySelector(':scope > .laser')) {
        const beam = document.createElement('div');
        beam.className = 'laser';
        el.prepend(beam);
    }
}

async function scanElement(el, ms = 1700) {
    if (!el) return;
    ensureLaser(el);
    el.style.setProperty('--scan-ms', ms + 'ms');
    el.classList.remove('scanning');
    void el.offsetWidth;
    el.classList.add('scanning');
    await sleep(ms);
    el.classList.remove('scanning');
}

function clearConsoles() {
    document.querySelectorAll('.ticket-wrap').forEach(w => w.classList.remove('active-review'));
    document.querySelectorAll('.ticket-console').forEach(c => { c.innerHTML = ''; });
}

function showPhaseConsole(on) {
    phaseConsole.classList.toggle('show', !!on);
    if (!on) phaseConsole.innerHTML = '';
}

function consoleLine(host, html) {
    if (!host) return;
    const row = document.createElement('div');
    row.innerHTML = html;
    host.appendChild(row);
    host.scrollTop = host.scrollHeight;
}

async function agentThink(hosts, src, line, cls = '') {
    const html = `<span class="k">${src}</span> <span class="${cls}">${line}</span>`;
    hosts.filter(Boolean).forEach(h => consoleLine(h, html));
    log(src, line.replace(/<[^>]+>/g, ''));
    if (window.SiteI18n) SiteI18n.refreshTranslation();
    await sleep(280 + Math.floor(Math.random() * 220));
}

async function askHandoff(doneAgent, nextAgent) {
    closeModal();
    track('sim_handoff_prompt', 'Simulator', `${doneAgent.name} → ${nextAgent.name}`, { from_agent: doneAgent.id, to_agent: nextAgent.id });
    banner.innerHTML = `<div class="handoff"><div><strong>${doneAgent.name} finished.</strong> Hand off to ${nextAgent.name}? <span style="color:var(--muted)">${nextAgent.role}</span></div><button class="btn btn-primary" id="handoffBtn" type="button">Start ${nextAgent.name}</button></div>`;
    if (window.SiteI18n) SiteI18n.refreshTranslation();
    log('SYSTEM', `Waiting for operator to start ${nextAgent.name}.`);
    const btn = document.getElementById('handoffBtn');
    if (btn) btn.onclick = () => resume(true);
    await waitUser();
    track('sim_handoff_start', 'Simulator', nextAgent.name, { from_agent: doneAgent.id, to_agent: nextAgent.id });
}

    if (!Object.values(state.verify).every(Boolean)) {
        log('A4', 'Sign-off blocked: complete every verification checkbox.');
        track('sim_sign_off_blocked', 'Simulator', 'incomplete DoD');
        return;
    }
    log('A4', 'Increment signed off for Sprint 24.');
    track('sim_sign_off', 'Simulator', 'Sprint 24');
    resume(true);
    setView('report');
}

function renderReport() {
    viewEl.className = 'tests';
    const accepted = state.tickets.filter(t => t.decision === 'accept').length;
    const kept = state.tickets.filter(t => t.decision === 'keep' || t.decision === 'ok').length;
    const cases = state.tickets.flatMap(t => t.tests);
    const inSprint = cases.filter(t => t.include).length;
    const passed = state.results.filter(r => r.ok).length;
    viewEl.innerHTML = `
        <h2 style="margin-top:0">Sprint 24 report</h2>
        <div class="grid2">
            <div class="card"><h3>Agent 1 · Stories</h3><p>${accepted} rewritten · ${kept} kept as-is · ${state.tickets.length} total</p></div>
            <div class="card"><h3>Agent 2 · Xray</h3><p>${inSprint} of ${cases.length} cases selected for the sprint</p></div>
            <div class="card"><h3>Agent 3 · Automation</h3><p>${passed}/${state.results.length} scripted runs passed</p></div>
            <div class="card"><h3>Agent 4 · Verification</h3><p>${Object.values(state.verify).every(Boolean) ? 'Increment signed off' : 'Pending sign-off'}</p></div>
        </div>
        <p style="color:var(--muted)">This studio is a live CV demo of how specialized agents collaborate on a real Scrum increment: refine Jira, curate Xray, generate automation, then verify the DoD.</p>`;
}

async function runSprint() {
    if (state.running) return;
    state.running = true;
    document.getElementById('runBtn').disabled = true;
    closeModal();
    showPhaseConsole(false);
    setView('board');
    track('sim_run_sprint', 'Simulator', 'Sprint 24');

    state.agent = 'a1'; renderAgents();
    track('sim_agent_start', 'Simulator', 'Ticket Steward', { agent_id: 'a1' });

    state.agent = 'a1'; renderAgents();
    banner.innerHTML = '<strong>Agent 1 · Ticket Steward</strong> — scanning each Jira issue, then proposing testable AC. You decide.';
    if (window.SiteI18n) SiteI18n.refreshTranslation();
    log('A1', 'Standing by to review Sprint 24 stories.');

    for (const t of state.tickets) {
        clearConsoles();
        const wrap = document.getElementById('wrap-' + t.key);
        const card = document.getElementById('card-' + t.key);
        const boardConsole = document.getElementById('console-' + t.key);
        if (wrap) wrap.classList.add('active-review');
        if (card) {
            card.classList.add('pulse');
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        const hosts = [boardConsole];
        await agentThink(hosts, 'A1', `opening ${t.key} · ${escapeHtml(t.summary)}`);
        await scanElement(card);
        await agentThink(hosts, 'A1', 'reading description, comments and current AC…');
        await agentThink(hosts, 'A1', `finding: ${escapeHtml(t.findings)}`, 'dec');
        await agentThink(hosts, 'A1', 'drafting Gherkin-ready acceptance rewrite…', 'dec');
        openTicket(t.key, { propose: true });
        const modalConsole = document.getElementById('ticketConsole');
        const stage = document.getElementById('ticketScanStage');
        hosts.push(modalConsole);
        await agentThink([modalConsole], 'A1', `loaded ${t.key} in Jira issue view`);
        await scanElement(stage);
        await agentThink([modalConsole], 'A1', 'diffing original AC vs testable scenarios…', 'dec');
        await agentThink([modalConsole], 'A1', 'waiting for operator: Accept rewrite or Keep original.', 'dec');
        const decision = await waitUser();
        t.decision = decision === 'accept' ? 'accept' : 'keep';
        track('sim_ticket_decision', 'Simulator', t.key, { decision: t.decision });
        if (decision === 'accept') {
            t.ac = t.proposedAc;
            await agentThink(hosts, 'USER', `${t.key} rewrite accepted.`, 'ok');
        } else {
            await agentThink(hosts, 'USER', `${t.key} original AC kept.`);
        }
        t.column = 'Ready for QA';
        closeModal();
        renderBoard();
        await sleep(200);
    }
    clearConsoles();
    renderAgents();
    await askHandoff(AGENTS[0], AGENTS[1]);

    state.agent = 'a2'; renderAgents();
    track('sim_agent_start', 'Simulator', 'Test Designer', { agent_id: 'a2' });
    banner.innerHTML = '<strong>Agent 2 · Test Designer</strong> — Xray/TestRail view. Uncheck cases that should stay in the repo backlog, then approve.';
    setView('tests');
    showPhaseConsole(true);
    const testHosts = [phaseConsole];
    await agentThink(testHosts, 'A2', 'mapping each story to Xray keys…');
    const tableWrap = document.querySelector('#view table');
    if (tableWrap) {
        const stage = document.createElement('div');
        stage.className = 'scan-stage';
        tableWrap.parentNode.insertBefore(stage, tableWrap);
        stage.appendChild(tableWrap);
        await scanElement(stage, 1600);
    }
    await agentThink(testHosts, 'A2', 'authoring Gherkin Given / When / Then for included cases…', 'dec');
    await agentThink(testHosts, 'A2', 'script: Feature: Sprint 24 payments · Scenario Outline: capture + 3DS', 'dec');
    await agentThink(testHosts, 'A2', 'waiting for operator to approve the sprint test set.', 'dec');
    await waitUser();
    state.tickets.forEach(t => t.tests.forEach(tc => { if (tc.include) t.column = 'Ready for QA'; }));
    renderAgents();
    await askHandoff(AGENTS[1], AGENTS[2]);

    state.agent = 'a3'; renderAgents();
    track('sim_agent_start', 'Simulator', 'Automation Engineer', { agent_id: 'a3' });
    banner.innerHTML = '<strong>Agent 3 · Automation Engineer</strong> — generating Playwright, Cypress and Robot scripts, then executing the sprint set.';
    showPhaseConsole(true);
    const selected = state.tickets.flatMap(t => t.tests.filter(tc => tc.include));
    const frameworks = ['Playwright', 'Cypress', 'Robot'];
    state.results = [];
    for (const tc of selected) {
        const fw = frameworks[state.results.length % 3];
        state.autoFocus = tc;
        renderAuto();
        const specBlock = document.querySelector('#view .code');
        if (specBlock) {
            specBlock.parentElement.style.position = 'relative';
            specBlock.parentElement.style.overflow = 'hidden';
            await scanElement(specBlock.parentElement, 1100);
        }
        const sn = snippets(tc);
        const sample = fw === 'Playwright' ? sn.playwright : fw === 'Cypress' ? sn.cypress : sn.robot;
        await agentThink(testHosts, 'A3', `scaffolding ${fw} spec for ${tc.id} · ${escapeHtml(tc.title)}`, 'dec');
        await agentThink(testHosts, 'A3', escapeHtml(sample.split('\n')[0]), 'dec');
        await agentThink(testHosts, 'A3', `compiling / launching ${fw} runner…`);
        const ok = !(tc.id === 'XT-1401' && fw === 'Robot');
        const ms = 420 + Math.floor(Math.random() * 900);
        state.results.push({ id: tc.id, fw, ok, ms });
        await agentThink(testHosts, 'A3', ok ? `${tc.id} [${fw}] PASSED (${ms} ms)` : `${tc.id} [${fw}] FAILED · retry queued`, ok ? 'ok' : '');
        track('sim_automation_result', 'Simulator', tc.id, { framework: fw, passed: ok, duration_ms: ms });
        renderAuto();
        await sleep(120);
    }
    await agentThink(testHosts, 'A3', 'Run complete. Report attached to the sprint.', 'ok');
    renderAgents();
    await askHandoff(AGENTS[2], AGENTS[3]);

    state.agent = 'a4'; renderAgents();
    track('sim_agent_start', 'Simulator', 'Release Verifier', { agent_id: 'a4' });
    banner.innerHTML = '<strong>Agent 4 · Release Verifier</strong> — walk the Definition of Done. Tick every control, then sign off.';
    setView('verify');
    showPhaseConsole(true);
    const dod = document.querySelector('#view .card');
    if (dod) {
        dod.style.position = 'relative';
        dod.style.overflow = 'hidden';
        await scanElement(dod, 1400);
    }
    await agentThink(testHosts, 'A4', 'collecting DoD evidence from Agents 1–3…', 'dec');
    await agentThink(testHosts, 'A4', 'deciding: increment is ready only if every control is ticked.', 'dec');
    await agentThink(testHosts, 'A4', 'waiting for human verification of every control.', 'dec');
    await waitUser();
    state.tickets.forEach(t => { if (t.tests.some(tc => tc.include)) t.column = 'Done'; });
    banner.innerHTML = '<strong>Sprint 24 complete.</strong> Review the report or reset to run again.';
    if (window.SiteI18n) SiteI18n.refreshTranslation();
    state.running = false;
    document.getElementById('runBtn').disabled = false;
    renderAgents();
    renderBoard();
    setView('report');
    showPhaseConsole(true);
    track('sim_sprint_complete', 'Simulator', 'Sprint 24', {
        rewritten: state.tickets.filter(t => t.decision === 'accept').length,
        runs: state.results.length,
        passed: state.results.filter(r => r.ok).length
    });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

document.getElementById('nav').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; setView(b.dataset.view);
});
document.getElementById('runBtn').onclick = runSprint;
document.getElementById('resetBtn').onclick = () => {
    track('sim_reset', 'Simulator', 'Reload');
    location.reload();
};
document.getElementById('homeBtn').onclick = () => {
    track('sim_home', 'Simulator', window.opener ? 'popup' : 'direct');
    if (window.SiteI18n) SiteI18n.goHome();
    else location.href = 'index.html';
};
overlay.addEventListener('click', e => { if (e.target === overlay && !state.running) closeModal(); });

function mountLanguageMenu() {
    const wrap = document.getElementById('langWrap');
    const toggle = document.getElementById('langToggle');
    const menu = document.getElementById('langMenu');
    const flag = document.getElementById('langFlag');
    if (!wrap || !window.SiteI18n) return;

    const syncFlag = (code) => {
        flag.src = SiteI18n.flagUrl(code);
        flag.alt = SiteI18n.displayName(code);
    };

    const render = (query) => {
        const list = menu.querySelector('.lang-options-list');
        if (!list) return;
        list.innerHTML = '';
        SiteI18n.orderedLanguages().forEach((meta) => {
            if (!SiteI18n.matchesQuery(meta, query)) return;
            const option = document.createElement('div');
            option.className = 'lang-option';
            option.dataset.lang = meta.code;
            option.innerHTML = `<img src="${SiteI18n.flagUrl(meta.code)}" alt=""><span>${meta.native}</span>`;
            option.onclick = () => {
                track('sim_language_change', 'Simulator', meta.code);
                SiteI18n.selectLanguage(meta.code);
            };
            list.appendChild(option);
        });
    };

    menu.innerHTML = '<input class="lang-search" type="search" placeholder="Search language" aria-label="Search language"><div class="lang-options-list"></div>';
    const search = menu.querySelector('.lang-search');
    search.addEventListener('input', () => render(search.value));
    search.addEventListener('click', (e) => e.stopPropagation());
    render('');
    toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        wrap.classList.toggle('open');
        if (wrap.classList.contains('open')) track('sim_language_menu', 'Simulator', 'Opened');
    });
    document.addEventListener('click', () => wrap.classList.remove('open'));
    SiteI18n.resolve().then((lang) => {
        syncFlag(lang);
        SiteI18n.loadWidget();
        SiteI18n.applyMachineTranslate(lang);
    });
}

mountLanguageMenu();
