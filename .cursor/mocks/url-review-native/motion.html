<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native shell tour · #4492</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050d11; --phone-bg: #0e151c; --line: rgba(126,214,224,.16); --line2: rgba(126,214,224,.32);
    --text: #e8f3f4; --muted: #8ea8ae; --cyan: #7ef6fb; --mint: #5dff9a; --gold: #f0c85a; --coral: #ff5a4a;
    --glass: rgba(10, 22, 27, .55); --teal: #5ec8d4;
    --font-ui: "Sora", system-ui, sans-serif; --font-display: "Instrument Serif", Georgia, serif;
    --ios-safe-t: 54px; --ios-safe-b: 28px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(70% 50% at 50% 0%, rgba(126,246,251,.08), transparent), var(--bg);
    color: var(--text); font-family: var(--font-ui);
  }
  .stage { width: 390px; height: 844px; position: relative; }
  .device {
    width: 100%; height: 100%; border-radius: 44px; border: 3px solid #2e3844;
    background: var(--phone-bg); overflow: hidden; position: relative;
    box-shadow: 0 32px 80px rgba(0,0,0,.55);
  }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 34px; background: #000; border-radius: 20px; z-index: 21; }
  .status-ios { position: absolute; left: 0; right: 0; top: 0; height: var(--ios-safe-t); padding: 14px 26px 0; z-index: 20; display: flex; justify-content: space-between; font: 600 12px/1 var(--font-ui); pointer-events: none; }
  .home-bar { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 132px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.28); z-index: 20; }
  .scenes { position: absolute; inset: 0; }
  .scene {
    position: absolute; inset: 0; padding: var(--ios-safe-t) 12px var(--ios-safe-b);
    display: flex; flex-direction: column; gap: 10px; opacity: 0; transition: opacity .55s ease;
    pointer-events: none;
  }
  .scene.on { opacity: 1; pointer-events: auto; }
  .badge {
    position: absolute; top: 62px; left: 50%; transform: translateX(-50%); z-index: 30;
    font: 700 9px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line2); background: rgba(8,16,20,.85);
    color: var(--cyan); opacity: 0; transition: opacity .35s;
  }
  .badge.on { opacity: 1; }
  .brand { display: flex; align-items: center; justify-content: space-between; }
  .brand b { font: 600 17px/1 var(--font-display); }
  .brand small { display: block; margin-top: 3px; font: 700 8px/1 var(--font-ui); letter-spacing: .18em; color: var(--cyan); }
  .pill { font: 600 10px/1 var(--font-ui); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--mint); }
  .hero { flex: 0 0 130px; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; position: relative; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .hero .cap { position: absolute; left: 12px; right: 12px; top: 12px; font: 400 1.1rem/1.05 var(--font-display); text-shadow: 0 2px 12px #000; }
  .hero .cap span { color: var(--cyan); font-style: italic; }
  .dock { margin-top: auto; padding: 14px; border-radius: 16px; border: 1px solid var(--line2); background: var(--glass); backdrop-filter: blur(16px); }
  .dock label { font: 700 9px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .url-row { margin-top: 8px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.28); font: 500 13px/1.2 var(--font-ui); }
  .chip-row { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; font: 600 11px/1 var(--font-ui); color: var(--muted); }
  .chip.on { color: #041014; background: linear-gradient(135deg, var(--cyan), var(--mint)); border-color: transparent; }
  .run { margin-top: 12px; width: 100%; border: 0; border-radius: 12px; padding: 14px; font: 700 14px/1 var(--font-ui); color: #041014; background: linear-gradient(135deg, #9ff9fd, #6fe3b1); }
  .arena img { flex: 1; width: 100%; border-radius: 12px; border: 1px solid var(--line); object-fit: cover; min-height: 520px; }
  .arena { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .report { flex: 1; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .prime { padding: 10px 12px; border-radius: 14px; border: 1px solid rgba(255,90,74,.35); background: rgba(255,90,74,.08); }
  .prime strong { font: 650 13px/1.3 var(--font-ui); }
  .scard { border: 1px solid var(--line2); border-radius: 14px; padding: 10px 12px; background: var(--glass); backdrop-filter: blur(18px); }
  .sticky { position: absolute; left: 10px; right: 10px; bottom: 30px; padding: 12px; border-radius: 16px; border: 1px solid var(--line2); background: rgba(8,16,20,.88); }
  .unlock { width: 100%; border: 0; border-radius: 11px; padding: 13px; font: 700 13px/1 var(--font-ui); color: #041014; background: linear-gradient(135deg, var(--gold), #f0c85a); }
</style>
</head>
<body>
<div class="stage" id="viewport-root">
  <div class="device">
    <div class="island"></div>
    <div class="status-ios"><span>9:41</span><span>5G 88%</span></div>
    <div class="badge on" id="scene-badge">A · Entry</div>
    <div class="scenes">
      <div class="scene on" data-badge="A · Entry" id="scene-0">
        <div class="brand"><div><b>QA-lab</b><small>URL REVIEW</small></div><span class="pill">Bench ready</span></div>
        <div class="hero">
          <img src="../mobile-spearhead/review/real-arena-lab.png" alt="">
          <div class="cap">Drop a URL on the <span>specimen tray</span></div>
        </div>
        <div class="dock">
          <label>Specimen URL</label>
          <div class="url-row">https://example-shop.com</div>
          <div class="chip-row"><span class="chip on">Speed Trap</span><span class="chip">SEO Leaks</span></div>
          <button class="run" type="button">Run diagnostics</button>
        </div>
      </div>
      <div class="scene" data-badge="B · Arena" id="scene-1">
        <div class="arena">
          <img src="../mobile-spearhead/review/real-arena-signing.png" alt="">
        </div>
      </div>
      <div class="scene" data-badge="C · Report" id="scene-2">
        <div class="report">
          <div class="prime"><strong>LCP waits 4.8s on the hero image</strong></div>
          <div class="scard">Trust &amp; headers · 🔒 StatusCard rows</div>
          <div class="scard">Core vitals &amp; bloat · 🔒</div>
          <div class="sticky"><button class="unlock" type="button">Unlock full lab report — $5</button></div>
        </div>
      </div>
    </div>
    <div class="home-bar"></div>
  </div>
</div>
<script>
(function () {
  const scenes = [...document.querySelectorAll(".scene")];
  const badge = document.getElementById("scene-badge");
  let i = 0;
  function show(n) {
    scenes.forEach((s, idx) => s.classList.toggle("on", idx === n));
    badge.textContent = scenes[n].dataset.badge || "";
    badge.classList.add("on");
    i = n;
  }
  setInterval(() => show((i + 1) % scenes.length), 2800);
})();
</script>
</body>
</html>
