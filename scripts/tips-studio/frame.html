<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tips studio frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root { --ink: #050c0f; --cyan: #4db3bb; --cyan-hi: #7ef6fb; --gold: #e2c48a; --text: #eef6f7; --muted: #a9bcc1; --fail: #ff8a80; --risk: #f0b45a; --pass: #6fe3b1; --accent: #7ef6fb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); }
  body { font-family: Inter, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  #c { position: relative; overflow: hidden; background: radial-gradient(70% 45% at 85% 5%, rgba(77,179,187,.30), transparent 70%), radial-gradient(60% 40% at 0% 100%, rgba(185,166,255,.20), transparent 70%), linear-gradient(180deg, #071318, #050c0f 60%); }
  .feed { width: 1080px; height: 1350px; --pad: 72px; --title: 104px; --body: 34px; --mono: 30px; --u: 26px; }
  .story, .clip { width: 1080px; height: 1920px; --pad: 84px; --title: 118px; --body: 38px; --mono: 32px; --u: 30px; }

  .floor { position: absolute; left: -50%; right: -50%; bottom: -12%; height: 62%; transform-origin: 50% 0; transform: perspective(900px) rotateX(72deg); background-image: linear-gradient(rgba(126,246,251,.16) 2px, transparent 2px), linear-gradient(90deg, rgba(126,246,251,.16) 2px, transparent 2px); background-size: 90px 90px; -webkit-mask-image: linear-gradient(180deg, transparent, #000 35%, #000); animation: drift 12s linear both; }
  @keyframes drift { from { background-position: 0 0; } to { background-position: 0 360px; } }
  /* Fusion backdrop (media/fusion-stage, rendered by scripts/fusion/stage.js); the themed series keep their own skies. */
  .fusion { position: absolute; inset: 0; overflow: hidden; }
  .fusion img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 62% 22%; animation: fusionDrift 12s linear both; }
  .fusion::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,12,15,.3) 0%, rgba(5,12,15,.62) 30%, rgba(5,12,15,.8) 60%, rgba(5,12,15,.88) 100%); }
  .feed .fusion img, .story .fusion img { animation: none; }
  @keyframes fusionDrift { from { transform: scale(1); } to { transform: scale(1.09) translateY(-1.5%); } }
  #c:not([data-theme="horror"]):not([data-theme="muertos"]) .floor, #c:not([data-theme="horror"]):not([data-theme="muertos"]) .cube { display: none; }
  [data-theme="horror"] .fusion, [data-theme="muertos"] .fusion { display: none; }
  .grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .cube { position: absolute; width: var(--s); height: var(--s); transform-style: preserve-3d; transform: perspective(800px) rotateX(-20deg) rotateY(35deg); animation: spin 12s linear both; }
  .clip .floor.a, .clip .cube.a { animation-timing-function: linear; }
  .cube i { position: absolute; inset: 0; border: 2px solid rgba(126,246,251,.55); background: rgba(126,246,251,.06); box-shadow: inset 0 0 30px rgba(126,246,251,.15); }
  .cube i:nth-child(1) { transform: translateZ(calc(var(--s) / 2)); }
  .cube i:nth-child(2) { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
  .cube i:nth-child(3) { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
  .cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
  .cube i:nth-child(5) { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
  .cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
  @keyframes spin { from { transform: perspective(800px) rotateX(-20deg) rotateY(0deg); } to { transform: perspective(800px) rotateX(-20deg) rotateY(240deg); } }

  .stack { position: absolute; inset: 0; display: flex; flex-direction: column; padding: var(--pad); gap: calc(var(--u) * 1.2); }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; filter: drop-shadow(0 6px 18px rgba(77,179,187,.4)); }
  .brand b { display: block; font-weight: 700; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; }
  .brand small { display: block; margin-top: 4px; color: var(--muted); font-size: 20px; }
  .count { font-family: "Fira Code", monospace; font-size: 24px; color: var(--muted); }
  .chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; border: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); background: rgba(10,30,36,.6); border-radius: 999px; padding: 10px 22px; font-size: 26px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .chip i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
  .title { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: var(--title); line-height: .98; letter-spacing: -0.025em; text-wrap: balance; }
  .title span { display: block; }
  .title em { font-style: italic; background: linear-gradient(92deg, var(--cyan-hi), #b8f3ea 45%, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .06em; }
  .body { margin: 0; font-size: var(--body); line-height: 1.4; color: #cfe0e3; text-wrap: pretty; }

  .scene { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; perspective: 1600px; }
  .card3d { width: 100%; transform-style: preserve-3d; transform: rotateX(8deg) rotateY(-12deg); }
  .glass { position: relative; background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.02)); border: 2px solid rgba(126,246,251,.24); border-radius: 30px; backdrop-filter: blur(16px); box-shadow: 0 40px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12); padding: calc(var(--u) * 1.3); }
  .glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; transform: translateZ(-60px); background: rgba(126,246,251,.08); filter: blur(30px); }
  .code { font-family: "Fira Code", monospace; font-size: var(--mono); line-height: 1.5; white-space: pre; overflow: hidden; }
  .code .ln { display: block; }
  .code .ln b { color: var(--cyan-hi); font-weight: 500; }
  .note { margin-top: calc(var(--u) * .7); font-size: calc(var(--body) * .72); color: var(--muted); }
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * .8); }
  .vs .side { border-radius: 22px; padding: calc(var(--u) * .9); background: rgba(5,12,15,.45); border: 2px solid; }
  .vs .side.fail { border-color: color-mix(in srgb, var(--fail) 55%, transparent); }
  .vs .side.pass { border-color: color-mix(in srgb, var(--pass) 55%, transparent); transform: translateZ(40px); }
  .vs h4 { margin: 0 0 12px; font-size: calc(var(--body) * .7); letter-spacing: .08em; text-transform: uppercase; }
  .vs .fail h4 { color: var(--fail); } .vs .pass h4 { color: var(--pass); }
  .vs .code { font-size: calc(var(--mono) * .78); white-space: pre-wrap; word-break: break-word; }
  .rows { display: flex; flex-direction: column; gap: calc(var(--u) * .55); }
  .row { display: grid; grid-template-columns: 54px 1fr; gap: 6px 18px; align-items: center; padding: calc(var(--u) * .55) calc(var(--u) * .7); border-radius: 18px; background: rgba(5,12,15,.4); }
  .row .m { grid-row: span 2; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 28px; color: var(--ink); }
  .row .m.pass { background: var(--pass); } .row .m.fail { background: var(--fail); } .row .m.risk { background: var(--risk); }
  .row b { font-size: calc(var(--body) * .86); }
  .row small { font-size: calc(var(--body) * .66); color: var(--muted); }
  .tight .glass { padding: calc(var(--u) * .8) calc(var(--u) * 1); }
  .tight .rows { gap: calc(var(--u) * .35); }
  .tight .row { grid-template-columns: 44px auto 1fr; padding: calc(var(--u) * .4) calc(var(--u) * .6); }
  .tight .row .m { grid-row: auto; width: 44px; height: 44px; font-size: 24px; }
  .tight .row small { text-align: right; }
  .rows.two { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * .45) calc(var(--u) * .5); }
  .rows.two .row { grid-template-columns: 46px 1fr; gap: 2px 14px; padding: calc(var(--u) * .45) calc(var(--u) * .55); }
  .rows.two .row .m { grid-row: span 2; width: 46px; height: 46px; font-size: 24px; }
  .rows.two .row b { font-size: calc(var(--body) * .78); }
  .rows.two .row small { font-size: calc(var(--body) * .6); text-align: left; }
  .tight .picks { gap: calc(var(--u) * .25); }
  .tight .pick { padding: calc(var(--u) * .3) calc(var(--u) * .5); }
  .picks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: calc(var(--u) * .5); }
  .pick { display: grid; grid-template-columns: 58px 1fr; gap: 4px 20px; align-items: center; padding: calc(var(--u) * .5) calc(var(--u) * .7); border-radius: 18px; background: rgba(5,12,15,.4); }
  .pick .n { grid-row: span 2; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font-family: "Instrument Serif", Georgia, serif; font-size: 40px; line-height: 1; color: var(--ink); background: linear-gradient(135deg, var(--cyan-hi), var(--gold)); }
  .pick b { font-size: calc(var(--body) * .86); line-height: 1.2; }
  .pick small { font-size: calc(var(--body) * .62); color: var(--muted); }
  .bars { display: flex; flex-direction: column; gap: calc(var(--u) * .6); }
  .bar { display: grid; grid-template-columns: 180px 1fr 170px; gap: 16px; align-items: center; font-family: "Fira Code", monospace; font-size: calc(var(--mono) * .85); }
  .bar .t { height: 30px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar .t span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--cyan), var(--cyan-hi)); transform-origin: left; }
  .bar.max .t span { background: linear-gradient(90deg, var(--risk), var(--fail)); }
  .bar .v { text-align: right; color: var(--muted); }
  .stat { text-align: center; padding: calc(var(--u) * 1.4) 0; }
  .stat b { display: block; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: calc(var(--title) * 2); line-height: 1; background: linear-gradient(92deg, var(--cyan-hi), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat small { font-size: calc(var(--body) * .8); color: var(--muted); }
  .scores { display: grid; grid-template-columns: 250px 1fr; gap: calc(var(--u) * 1.1); align-items: center; }
  .ring { position: relative; display: grid; place-items: center; }
  .ring svg { width: 100%; height: auto; transform: rotate(-90deg); overflow: visible; }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .bg { stroke: rgba(255,255,255,.08); }
  .ring .fg { stroke-linecap: round; stroke-dasharray: var(--c); filter: drop-shadow(0 0 10px currentColor); }
  .ring .fg.pass { color: var(--pass); stroke: var(--pass); } .ring .fg.risk { color: var(--risk); stroke: var(--risk); } .ring .fg.fail { color: var(--fail); stroke: var(--fail); }
  .ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Instrument Serif", Georgia, serif; font-size: 44px; line-height: 1; }
  .ring.big .n { font-size: 120px; background: linear-gradient(92deg, var(--cyan-hi), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ring.big .fg { stroke: url(#gold); color: var(--cyan-hi); stroke-width: 12; }
  .areas { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * .7) calc(var(--u) * .6); }
  .area { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .area .ring { width: 118px; }
  .area small { font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .feed .scores { grid-template-columns: 190px 1fr; }
  .feed .area .ring { width: 92px; }
  .feed .ring .n { font-size: 36px; }
  .feed .ring.big .n { font-size: 92px; }
  .feed .area small { font-size: 18px; }
  .feed .glass:has(.scores) { padding: calc(var(--u) * .9) calc(var(--u) * 1.1); }
  .matrix { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0 12px; font-family: "Fira Code", monospace; font-size: var(--mono); }
  .matrix col.host { width: 27%; } .matrix col.total { width: 12%; }
  .matrix th { font-family: Inter, system-ui, sans-serif; font-size: 12px; letter-spacing: 0; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: center; padding: 0 2px; }
  .matrix th:first-child, .matrix td:first-child { text-align: left; }
  .matrix td { text-align: center; padding: 12px 4px; background: rgba(5,12,15,.45); white-space: nowrap; }
  .matrix td:first-child { border-radius: 18px 0 0 18px; padding-left: 20px; overflow: hidden; text-overflow: ellipsis; font-family: Inter, system-ui, sans-serif; font-size: calc(var(--body) * .7); font-weight: 700; color: var(--accent); }
  .matrix td:last-child { border-radius: 0 18px 18px 0; }
  .matrix tr.own td { background: rgba(126,246,251,.12); }
  .matrix tr.own td:first-child { color: var(--cyan-hi); box-shadow: inset 4px 0 0 var(--cyan-hi); }
  .matrix td.total { font-family: "Instrument Serif", Georgia, serif; font-size: calc(var(--mono) * 1.4); line-height: 1; }
  .matrix td.pass { color: var(--pass); } .matrix td.risk { color: var(--risk); } .matrix td.fail { color: var(--fail); }
  .matrix td.lead { font-weight: 700; text-shadow: 0 0 14px currentColor; }
  .matrix td.lead::after { content: "✓"; font-family: Inter, system-ui, sans-serif; font-size: .5em; vertical-align: super; margin-left: 3px; }
  .scores-note { margin-top: calc(var(--u) * .9); font-family: "Fira Code", monospace; font-size: calc(var(--mono) * .7); color: var(--muted); text-align: center; }
  .vs .side.risk { border-color: color-mix(in srgb, var(--risk) 55%, transparent); } .vs .risk h4 { color: var(--risk); }
  .quiz { display: grid; grid-template-columns: 1fr auto 1fr; gap: calc(var(--u) * .6); align-items: stretch; }
  .quiz .side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: calc(var(--u) * 1.1) calc(var(--u) * .6); border-radius: 22px; background: rgba(5,12,15,.45); border: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .quiz .side b { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: calc(var(--title) * .56); line-height: 1; }
  .quiz .side small { font-family: "Fira Code", monospace; font-size: calc(var(--mono) * .62); color: var(--muted); word-break: break-all; }
  .quiz .side i { font-style: normal; font-family: "Instrument Serif", Georgia, serif; font-size: calc(var(--title) * 1.3); line-height: 1; background: linear-gradient(92deg, var(--cyan-hi), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .quiz .or { align-self: center; font-family: "Fira Code", monospace; font-size: calc(var(--mono) * .9); color: var(--gold); letter-spacing: .1em; text-transform: uppercase; }
  .clip .quiz .side i.a { animation-name: pulse; animation-duration: .9s; animation-iteration-count: 8; animation-direction: alternate; animation-fill-mode: none; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.14); } }
  .myth { display: flex; flex-direction: column; gap: calc(var(--u) * .8); }
  .myth .m, .myth .f { border-radius: 22px; padding: calc(var(--u) * .9) calc(var(--u) * 1); background: rgba(5,12,15,.45); border: 2px solid; }
  .myth .m { border-color: color-mix(in srgb, var(--fail) 55%, transparent); }
  .myth .f { border-color: color-mix(in srgb, var(--pass) 55%, transparent); transform: translateZ(40px); }
  .myth h4 { margin: 0 0 12px; font-size: calc(var(--body) * .7); letter-spacing: .08em; text-transform: uppercase; }
  .myth .m h4 { color: var(--fail); } .myth .f h4 { color: var(--pass); }
  .myth .m p { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-size: calc(var(--title) * .5); line-height: 1.1; color: #cfe0e3; }
  .myth .m p span { background: linear-gradient(var(--fail), var(--fail)) no-repeat 0 58% / 100% 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .clip .myth .m p span.a { animation-name: strike; animation-duration: .9s; }
  @keyframes strike { from { background-size: 0 4px; } to { background-size: 100% 4px; } }
  .myth .f p { margin: 0; font-size: calc(var(--body) * .9); line-height: 1.38; }
  .term .w { font-family: "Fira Code", monospace; font-weight: 600; font-size: calc(var(--title) * .6); line-height: 1.05; color: var(--cyan-hi); word-break: break-word; }
  .term .k { margin: 12px 0 calc(var(--u) * .8); font-size: calc(var(--body) * .7); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .term .code { font-size: calc(var(--mono) * .82); white-space: pre-wrap; word-break: break-word; padding: 18px 22px; border-radius: 16px; background: rgba(5,12,15,.5); }
  .clip .fg.a { animation-name: ring; animation-duration: 1.4s; }
  @keyframes ring { from { stroke-dashoffset: var(--c); } to { stroke-dashoffset: var(--o); } }

  .action { display: flex; gap: 18px; align-items: flex-start; padding: calc(var(--u) * .8) calc(var(--u) * 1); border-radius: 22px; background: linear-gradient(135deg, rgba(126,246,251,.14), rgba(226,196,138,.10)); border: 2px solid rgba(126,246,251,.25); font-size: calc(var(--body) * .86); line-height: 1.35; }
  .action b { color: var(--gold); white-space: nowrap; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 20px; font-size: 21px; color: var(--muted); white-space: nowrap; }
  .foot strong { color: var(--text); font-weight: 600; }

  .end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; text-align: center; padding: 120px; background: radial-gradient(60% 40% at 50% 45%, rgba(77,179,187,.3), transparent 70%), linear-gradient(rgba(5,12,15,.5), rgba(5,12,15,.86)), url(../../media/fusion-stage/story-b.jpg) center / cover, #050c0f; opacity: 0; }
  .end > img { width: 180px; height: 180px; filter: drop-shadow(0 18px 60px rgba(77,179,187,.5)); }
  .end h2 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 110px; line-height: 1; }
  .end p { margin: 0; font-size: 40px; color: #cfe0e3; }
  .end .url { white-space: nowrap; font-family: "Fira Code", monospace; font-size: 34px; color: var(--cyan-hi); border: 2px solid rgba(126,246,251,.35); border-radius: 999px; padding: 14px 30px; }

  /* Seasonal theme, set by a source's category (cat.theme). */
  #c[data-theme="horror"] { --ink: #07040a; --cyan: #e8711a; --cyan-hi: #ff9a3d; --gold: #b8f36b; --text: #f6efe6; --muted: #bba99a;
    background: radial-gradient(circle at 900px 198px, #f3ead6 0 52px, rgba(243,234,214,.18) 56px, transparent 150px), radial-gradient(70% 45% at 85% 5%, rgba(232,113,26,.22), transparent 70%), radial-gradient(60% 40% at 0% 100%, rgba(150,70,200,.28), transparent 70%), linear-gradient(180deg, #140a16, #07040a 60%); }
  [data-theme="horror"] .floor { background-image: linear-gradient(rgba(255,154,61,.14) 2px, transparent 2px), linear-gradient(90deg, rgba(255,154,61,.14) 2px, transparent 2px); }
  [data-theme="horror"] .cube { display: none; }
  [data-theme="horror"] .brand img { filter: drop-shadow(0 6px 18px rgba(232,113,26,.45)); }
  [data-theme="horror"] .chip { background: rgba(40,16,8,.6); }
  [data-theme="horror"] .body { color: #e6d9cc; }
  [data-theme="horror"] .glass { border-color: rgba(255,154,61,.26); }
  [data-theme="horror"] .glass::after { background: rgba(232,113,26,.10); }
  [data-theme="horror"] .action { background: linear-gradient(135deg, rgba(232,113,26,.16), rgba(184,243,107,.10)); border-color: rgba(255,154,61,.28); }
  [data-theme="horror"] .end { background: radial-gradient(circle at 50% 22%, #f3ead6 0 90px, rgba(243,234,214,.25) 96px, transparent 300px), radial-gradient(60% 40% at 50% 55%, rgba(232,113,26,.30), transparent 70%), #07040a; }
  [data-theme="horror"] .end .url { border-color: rgba(255,154,61,.4); }

  /* Día de Muertos: papel picado along the top, a path of marigold petals for a floor, a row of candles along the bottom. */
  #c[data-theme="muertos"] { --ink: #0c0610; --cyan: #f29a0c; --cyan-hi: #ffc23d; --gold: #ff6fae; --text: #fbf3e8; --muted: #cbb5a6;
    background: radial-gradient(70% 40% at 88% 8%, rgba(242,154,12,.24), transparent 70%), radial-gradient(60% 40% at 0% 100%, rgba(214,40,120,.24), transparent 70%), radial-gradient(50% 30% at 100% 100%, rgba(120,60,200,.20), transparent 70%), linear-gradient(180deg, #1c0c22, #0c0610 62%); }
  #c[data-theme="muertos"]::before { content: ""; position: absolute; z-index: 1; left: 0; right: 0; top: 0; height: 58px; opacity: .9;
    background: linear-gradient(rgba(251,243,232,.55), rgba(251,243,232,.55)) 0 0/100% 3px no-repeat,

<body>
<div id="c"></div>
<script>
const MARK = '<img src="../../designs/3d/icon/qa-review-mark-fusion.svg" alt="">';
const fusion = (fmt, style) => '<div class="fusion"><img src="../../media/fusion-stage/' + (fmt === "feed" ? "portrait" : "story") + '-a.jpg" alt=""' + (style ? ' style="' + style + '"' : "") + "></div>";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const title = (lines) => lines.map((l) => "<span>" + esc(l).replace(/\*(.+?)\*/g, "<em>$1</em>") + "</span>").join("");
const hl = (line) => esc(line).replace(/^(\s*)([\w-]+)(:)/, '$1<b>$2</b>$3').replace(/(&lt;\/?)([a-z0-9]+)/g, '$1<b>$2</b>');
const MARKS = { pass: "✓", fail: "✕", risk: "!" };

// What build.js read for this post: { host, logo, logos: { host: src }, brands, shot, bench, nets, handle }.
let X = {};
const logoOf = (host) => (X.logos || {})[host] || (host === X.host ? X.logo : "");
const logo = (src, style, cls) => src ? '<span class="logo' + (cls ? " " + cls : "") + '"' + (style ? ' style="' + style + '"' : "") + '><img src="' + esc(src) + '" alt=""></span>' : "";
const bmark = (b, style, cls) => '<span class="bmark' + (cls ? " " + cls : "") + '" title="' + esc(b.name) + '"' + (style ? ' style="' + style + '"' : "") + '><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="' + b.hex + '" d="' + b.d + '"/></svg></span>';
const fillIn = (text, values) => String(text || "").replace(/\{(\w+)\}/g, (all, k) => values[k] !== undefined ? values[k] : all);
// A number written as plain digits counts up; "1 in 3" or "1,200" is drawn as written.
function countUp(value, delay) {
  const m = String(value).match(/^(\D*?)(\d{1,4})(\D*)$/);
  if (!m) return esc(value);
  return esc(m[1]) + '<span class="count-up a" style="--n:' + m[2] + ";--to:" + m[2] + ";animation-delay:" + delay.toFixed(2) + 's"></span>' + esc(m[3]);
}

// The site, the competitors, or the products the post names, in a row of official marks.
function marksRow(t0, big) {
  const size = big ? "--ls:110px;" : "--ls:72px;";
  let k = 0;
  const at = () => "animation-delay:" + (t0 + .16 * k++).toFixed(2) + "s";
  const hosts = Object.keys(X.logos || {}).filter((h) => X.logos[h]);
  if (hosts.length > 1) return '<div class="marks">' + hosts.slice(0, 4).map((h, i) => (i ? '<span class="vs">vs</span>' : "") + logo(X.logos[h], size + at(), "a")).join("") + "</div>";
  if (X.logo) return '<div class="marks">' + logo(X.logo, size + at(), "a") + '<span class="host">' + esc(X.host) + "</span></div>";
  if ((X.brands || []).length) return '<div class="marks">' + X.brands.map((b) => bmark(b, size + at(), "a") + (X.brands.length <= 2 ? '<span class="bname">' + esc(b.name) + "</span>" : "")).join("") + "</div>";
  return "";
}

function radar(areas, t0) {
  const nums = areas.filter((a) => typeof a[1] === "number");
  if (nums.length < 3) return "";
  const cx = 320, cy = 290, R = 210, n = areas.length;
  const pt = (i, r) => { const a = (-90 + 360 * i / n) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const poly = (f) => areas.map((a, i) => pt(i, f(a)).map((v) => v.toFixed(1)).join(",")).join(" ");
  const hi = Math.max(...nums.map((a) => a[1]));
  const lo = Math.min(...nums.map((a) => a[1]));
  const tone = (s) => hi === lo ? "" : s === hi ? "hi" : s === lo ? "lo" : "";
  const grid = [.25, .5, .75, 1].map((f) => '<polygon class="grid" points="' + poly(() => R * f) + '"/>').join("");
  const axes = areas.map((a, i) => { const [x, y] = pt(i, R); return '<line class="axis-l" x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>'; }).join("");
  const dots = areas.map((a, i) => typeof a[1] !== "number" ? "" : (([x, y]) => '<circle class="' + tone(a[1]) + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (tone(a[1]) ? 12 : 8) + '"/>')(pt(i, R * a[1] / 100))).join("");
  const labels = areas.map((a, i) => { const [x, y] = pt(i, R + 52); return '<text class="' + tone(a[1]) + '" x="' + x.toFixed(1) + '" y="' + (y + 9).toFixed(1) + '" text-anchor="middle">' + esc(a[0]) + " " + (a[1] == null ? "–" : a[1]) + "</text>"; }).join("");
  return '<svg class="radar" viewBox="0 0 640 580">' + grid + axes + '<g class="poly a" style="animation-delay:' + t0.toFixed(2) + 's"><polygon class="poly" points="' + poly((a) => R * (a[1] || 0) / 100) + '"/>' + dots + "</g>" + labels + "</svg>";
}

function benchStrip(t0) {
  const b = X.bench;
  if (!b || !ui.bench) return "";
  const mine = Math.min(9, Math.floor(b.overall / 10));
  const top = Math.max(...b.bins, 1);
  const bars = b.bins.map((n, i) => '<i class="a' + (i === mine ? " me" : "") + '" style="--h:' + (100 * n / top).toFixed(1) + "%;animation-delay:" + (t0 + i * .07).toFixed(2) + 's">' +
    (i === mine ? "<em>" + logo(X.logo, "", "") + b.overall + "</em>" : "") + "</i>").join("");
  const line = b.pct >= 100 && ui.benchTop ? ui.benchTop : ui.bench;
  return '<div class="glass bench" style="--sweep:' + (t0 + 1).toFixed(2) + 's"><div class="bins">' + bars + '</div><div class="axis"><span>0</span><span>50</span><span>100</span></div><p>' +
    fillIn(esc(line), { pct: "<b>" + new Intl.NumberFormat(ui.locale, { style: "percent" }).format(b.pct / 100) + "</b>", n: "<b>" + b.n.toLocaleString(ui.locale) + "</b>" }) + "</p></div>";
}

function race(rows, t0) {
  const best = Math.max(...rows.map((r) => r[1] || 0));
  return '<div class="glass race">' + rows.slice(0, 5).map((r, i) => '<div class="lane' + (r[1] === best ? " lead" : "") + '">' + (logo(logoOf(r[0])) || "<span></span>") + '<span class="h">' + esc(r[0]) + '</span><span class="t"><span class="a" style="width:' + (r[1] || 0) + "%;animation-delay:" + (t0 + i * .2).toFixed(2) + 's"></span></span><b>' + countUp(String(r[1] == null ? "–" : r[1]), t0 + i * .2) + "</b></div>").join("") + "</div>";
}

// A 16 or 32 px favicon is drawn smaller in its tile rather than blown up into a blur.
function smallLogos(c) {
  return Promise.all([...c.querySelectorAll(".logo img")].map((img) => img.decode().catch(() => {}).then(() => {
    if (img.naturalWidth && img.naturalWidth < 48 && !/svg/.test(img.src.slice(0, 30))) img.parentElement.classList.add("small");
  })));
}

function phone(s) {
  if (!X.shot) return "";
  return '<div class="phone a" style="animation-delay:' + (s.start + .5).toFixed(2) + 's"><div class="screen"><img src="' + esc(X.shot) + '" alt="" style="animation-duration:' + Math.max(2, s.dur - 1.4).toFixed(2) + "s;animation-delay:" + (s.start + 1).toFixed(2) + 's"></div>' +
    '<span class="tag">' + esc(X.host) + "</span></div>";
}

function visual(v, t0) {
  let at = t0;
  const step = (d) => { const s = at; at += d; return s; };
  if (v.type === "code") {
    return '<div class="glass"><div class="code">' + v.lines.map((l) => '<span class="ln a" style="animation-delay:' + step(.28).toFixed(2) + 's">' + (hl(l) || "&nbsp;") + "</span>").join("") + "</div>" + (v.note ? '<div class="note">' + esc(v.note) + "</div>" : "") + "</div>";
  }
  if (v.type === "versus") {
    const side = (s) => '<div class="side a ' + s.mark + '" style="animation-delay:' + step(.6).toFixed(2) + 's"><h4>' + MARKS[s.mark] + " " + esc(s.label) + '</h4><div class="code">' + s.lines.map((l) => '<span class="ln">' + hl(l) + "</span>").join("") + "</div></div>";
    return '<div class="glass"><div class="vs">' + side(v.left) + side(v.right) + "</div></div>";
  }
  if (v.type === "check") {
    return '<div class="glass"><div class="rows' + (v.items.length > 6 ? " two" : "") + '">' + v.items.map((r) => '<div class="row a" style="animation-delay:' + step(.4).toFixed(2) + 's"><span class="m ' + r[2] + '">' + MARKS[r[2]] + "</span><b>" + esc(r[0]) + "</b><small>" + esc(r[1]) + "</small></div>").join("") + "</div></div>";
  }
  if (v.type === "list") {
    return '<div class="glass"><ol class="picks">' + v.items.map((item, i) => '<li class="pick a" style="animation-delay:' + step(.4).toFixed(2) + 's"><span class="n">' + (i + 1) + "</span><b>" + esc(item.title) + "</b><small>" + esc(item.by) + "</small></li>").join("") + "</ol></div>";
  }
  if (v.type === "bars") {
    const max = Math.max(...v.items.map((i) => i[1]));
    return '<div class="glass"><div class="bars">' + v.items.map((i) => '<div class="bar' + (i[1] === max ? " max" : "") + '"><span>' + esc(i[0]) + '</span><span class="t"><span class="a" style="width:' + (i[1] / max * 100).toFixed(1) + "%;animation-delay:" + step(.35).toFixed(2) + 's"></span></span><span class="v">' + i[1].toLocaleString(ui.locale) + " " + esc(v.unit) + "</span></div>").join("") + "</div>" + (v.note ? '<div class="note">' + esc(v.note) + "</div>" : "") + "</div>";
  }
  if (v.type === "scores") {
    const ring = (score, r, cls, delay) => {
      const c = 2 * Math.PI * r;
      const o = c * (1 - score / 100);
      const tone = score >= 90 ? "pass" : score >= 70 ? "risk" : "fail";
      return '<svg viewBox="0 0 ' + (r * 2 + 24) + " " + (r * 2 + 24) + '"><defs><linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#7ef6fb"/><stop offset="1" stop-color="#e2c48a"/></linearGradient></defs>' +
        '<circle class="bg" cx="' + (r + 12) + '" cy="' + (r + 12) + '" r="' + r + '"/>' +
        '<circle class="fg a ' + (cls || tone) + '" cx="' + (r + 12) + '" cy="' + (r + 12) + '" r="' + r + '" style="--c:' + c.toFixed(1) + ";--o:" + o.toFixed(1) + ";stroke-dashoffset:" + o.toFixed(1) + ";animation-delay:" + delay.toFixed(2) + 's"/></svg>';
    };
    const big = '<div class="ring big">' + ring(v.overall, 110, "gold", step(.3)) + '<span class="n a in-up" style="animation-delay:' + (at - .1).toFixed(2) + 's">' + v.overall + "</span></div>";
    const areas = v.areas.map((a) => '<div class="area"><div class="ring">' + ring(a[1], 46, "", step(.22)) + '<span class="n">' + a[1] + "</span></div><small>" + esc(a[0]) + "</small></div>").join("");
    const head = X.logo ? '<div class="sitehead">' + logo(X.logo, "--ls:64px") + "<span>" + esc(X.host) + "</span></div>" : "";
    return '<div class="glass">' + head + '<div class="scores">' + big + '<div class="areas">' + areas + "</div></div>" + (v.note ? '<div class="scores-note">' + esc(v.note) + "</div>" : "") + "</div>";
  }
  if (v.type === "matrix") {
    const tone = (n) => n >= 90 ? "pass" : n >= 70 ? "risk" : "fail";
    const best = v.cols.map((c, i) => Math.max(...v.rows.map((r) => typeof r[i + 1] === "number" ? r[i + 1] : -1)));
    const cell = (n, i) => typeof n !== "number" ? '<td' + (i === 0 ? ' class="total"' : "") + ">–</td>" : '<td class="' + tone(n) + (i === 0 ? " total" : "") + (n === best[i] && v.rows.length > 1 ? " lead" : "") + '">' + n + "</td>";
    return '<div class="glass"><table class="matrix"><colgroup><col class="host"><col class="total">' + v.cols.slice(1).map(() => "<col>").join("") + '</colgroup><thead><tr><th></th>' + v.cols.map((c) => "<th>" + esc(c) + "</th>").join("") + "</tr></thead><tbody>" +
      v.rows.map((r, k) => '<tr class="a' + (k === 0 ? " own" : "") + '" style="animation-delay:' + step(.45).toFixed(2) + 's"><td>' + logo(logoOf(r[0])) + esc(r[0]) + "</td>" + r.slice(1).map(cell).join("") + "</tr>").join("") +
      "</tbody></table>" + (v.note ? '<div class="scores-note">' + esc(v.note) + "</div>" : "") + "</div>";
  }
  if (v.type === "quiz") {
    const side = (s) => '<div class="side a in-up" style="animation-delay:' + step(.5).toFixed(2) + 's"><i class="a" style="animation-delay:' + (at + .6).toFixed(2) + 's">?</i><b>' + esc(s.label) + "</b><small>" + esc(s.host) + "</small></div>";
    return '<div class="glass"><div class="quiz">' + side(v.sides[0]) + '<span class="or">' + esc(v.or || "or") + "</span>" + side(v.sides[1]) + "</div>" + (v.note ? '<div class="scores-note">' + esc(v.note) + "</div>" : "") + "</div>";
  }
  if (v.type === "myth") {
    const labels = v.labels || ["Myth", "Fact"];
    return '<div class="glass"><div class="myth"><div class="m a in-up" style="animation-delay:' + step(.4).toFixed(2) + 's"><h4>✕ ' + esc(labels[0]) + '</h4><p><span class="a" style="animation-delay:' + step(.9).toFixed(2) + 's">' + esc(v.myth) + "</span></p></div>" +
      '<div class="f a in-up" style="animation-delay:' + step(.5).toFixed(2) + 's"><h4>✓ ' + esc(labels[1]) + "</h4><p>" + esc(v.fact) + "</p></div></div></div>";
  }
  if (v.type === "term") {
    return '<div class="glass term"><div class="w a in-up" style="animation-delay:' + step(.4).toFixed(2) + 's">' + esc(v.value) + '</div><div class="k">' + esc(v.group) + "</div>" +
      (v.lines ? '<div class="code">' + v.lines.map((l) => '<span class="ln a" style="animation-delay:' + step(.28).toFixed(2) + 's">' + (hl(l) || "&nbsp;") + "</span>").join("") + "</div>" : "") +
      (v.note ? '<div class="note">' + esc(v.note) + "</div>" : "") + "</div>";
  }
  if (v.type === "stat") {
    const t = step(.5);
    return '<div class="glass stat"><b class="a in-up" style="animation-delay:' + t.toFixed(2) + 's">' + countUp(v.value, t + .2) + "</b><small>" + esc(v.caption) + "</small></div>";
  }
  return "";
}

const UI_EN = { tryThis: "Try this", tip: "Tip", guided: "Guided tour", never: "Never runs your tests", end: "", endNote: "How a public-page review works, step by step.", locale: "en-US" };
let ui = UI_EN;

window.paint = function (tip, cat, fmt, index, total, guideHost, lang, extras) {
  ui = Object.assign({}, UI_EN, lang || {});
  X = extras || {};
  document.documentElement.lang = ui.locale.slice(0, 2);
  const c = document.getElementById("c");
  c.className = fmt;
  c.style.setProperty("--accent", cat.color);
  c.dataset.theme = cat.theme || "";
  const tall = fmt !== "feed";
  // The lower cube would sit on a matrix's scores.
  const lower = tip.visual && tip.visual.type === "matrix" ? "" : '<div class="cube a" style="--s:70px;left:900px;top:1330px;animation-direction:reverse"><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  const cubes = tall
    ? '<div class="cube a" style="--s:120px;left:820px;top:260px"><i></i><i></i><i></i><i></i><i></i><i></i></div>' + lower
    : '<div class="cube a" style="--s:90px;left:900px;top:190px"><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  c.innerHTML =
    fusion(fmt) + '<div class="floor a"></div>' + cubes + '<div class="grain"></div>' +
    '<div class="stack">' +
      '<div class="top a in-up" style="animation-delay:.1s"><div class="brand">' + MARK + '<div><b>QA-lab</b><small>URL Review</small></div></div><span class="count">' + esc(tip.counter || ui.tip + " " + String(index + 1).padStart(2, "0") + " / " + total) + "</span></div>" +
      '<div class="chipline"><span class="chip a in-up" style="animation-delay:.4s"><i></i>' + esc(cat.label) + "</span>" + marksRow(.5, false).replace(/^<div class="marks">|<\/div>$/g, "") + "</div>" +
      '<h1 class="title a in-up" style="animation-delay:.7s">' + title(tip.title) + "</h1>" +
      '<p class="body a in-up" style="animation-delay:1.2s">' + esc(tip.body) + "</p>" +
      '<div class="scene"><div class="card3d a" style="animation-delay:1.5s">' + visual(tip.visual, 2.6) + "</div></div>" +
      '<div class="action a in-up" style="animation-delay:5s"><b>' + esc(tip.actionLabel || ui.tryThis) + "</b><span>" + esc(tip.action) + "</span></div>" +
      '<div class="foot a in-up" style="animation-delay:5.4s"><span>' + esc(ui.guided) + ' · <strong>' + esc(guideHost) + "</strong></span><span>" + esc(tip.footRight || ui.never) + "</span></div>" +
    "</div>" +
    (fmt === "clip" ? '<div class="end a" style="animation-delay:10s">' + MARK + "<h2>" + (ui.end ? esc(ui.end) : 'Let your page<br><em style="font-style:italic">do the talking.</em>') + "</h2><p>" + esc(ui.endNote) + '</p><span class="url">' + esc(guideHost) + "</span></div>" : "");
  if (fmt !== "clip") c.querySelectorAll(".a").forEach((el) => { el.style.animation = "none"; });
  return Promise.all([document.fonts.ready, smallLogos(c)]).then(() => {
    const scene = c.querySelector(".scene");
    const card = c.querySelector(".card3d");
    const room = scene.clientHeight * 0.94;
    if (card.offsetHeight > room) c.classList.add("tight");
    if (card.offsetHeight > room) card.style.zoom = (room / card.offsetHeight).toFixed(3);
    return true;
  });
};

// Scene clips: scenes = [{ id, start, dur, voiceAt, voiceDur }] from build.js, one per narrated line.
const CLIP_EN = { why: "Why it matters", more: "Did you know?" };
const SWAP = { hook: ["inDeep", "outSwing"], why: ["inSwing", "outThrough"], look: ["inRise", "outFlip"], more: ["inFlip", "outSink"], fix: ["inRise", "outThrough"] };
const cubeHtml = (style) => '<div class="cube" style="' + style + '">' + "<i></i>".repeat(6) + "</div>";

// Each word lights up as the voice reaches it, timed by its share of the line's characters.
function karaoke(text, from, dur) {
  const words = String(text || "").split(/\s+/).filter(Boolean);
  const chars = words.join(" ").length || 1;
  let seen = 0;
  return words.map((w) => { const at = from + dur * seen / chars; seen += w.length + 1; return '<span class="w" style="animation-delay:' + at.toFixed(2) + 's">' + esc(w) + "</span>"; }).join(" ");
}

function hookTitle(lines, t0) {
  let k = 0;
  const word = (w) => '<span class="wd" style="animation-delay:' + (t0 + 0.09 * k++).toFixed(2) + 's">' + esc(w) + "</span>";
  return lines.map((line) => "<span>" + line.split(/(\*[^*]+\*)/).filter((p) => p.trim()).map((part) => {
    const html = part.replace(/\*/g, "").split(/\s+/).filter(Boolean).map(word).join(" ");
    return /^\*.*\*$/.test(part) ? "<em>" + html + "</em>" : html;
  }).join(" ") + "</span>").join("");
}

window.paintClip = function (tip, cat, index, total, guideHost, lang, scenes, extras) {
  ui = Object.assign({}, UI_EN, lang || {});
  X = extras || {};
  const v = tip.visual || {};
  const label = (key) => (lang && lang[key]) || (ui.locale.startsWith("en") ? CLIP_EN[key] : "");
  document.documentElement.lang = ui.locale.slice(0, 2);
  const c = document.getElementById("c");
  c.className = "clip scenes";
  c.style.setProperty("--accent", cat.color);
  c.dataset.theme = cat.theme || "";
  const length = scenes.reduce((n, s) => Math.max(n, s.start + s.dur), 0);
  const L = "animation-duration:" + length.toFixed(2) + "s";
  let seed = index * 7919 + 17;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const dots = Array.from({ length: 26 }, () => '<i class="dot" style="left:' + (rand() * 100).toFixed(1) + "%;top:" + (30 + rand() * 80).toFixed(1) + "%;--d:" + (4 + rand() * 9).toFixed(1) +
    "px;--z:" + (-420 + rand() * 620).toFixed(0) + "px;--dx:" + (-90 + rand() * 180).toFixed(0) + "px;--dy:" + (-320 - rand() * 380).toFixed(0) + "px;" + L + '"></i>').join("");
  const sec = (n) => n.toFixed(2) + "s";
  const scene = (s, inner) => {
    const [enter, leave] = SWAP[s.id];
    return '<section class="sc ' + s.id + '" style="animation:' + enter + " .9s cubic-bezier(.2,.8,.2,1) " + sec(s.start) + " both, " + leave + " .6s cubic-bezier(.6,0,.8,.3) " + sec(s.start + s.dur - .6) + ' forwards"><div class="in">' + inner + "</div></section>";
  };
  const body = { hook: (s) => {
      const head = '<span class="chip a in-up" style="animation-delay:' + sec(s.start + .3) + '"><i></i>' + esc(cat.label) + "</span>" + marksRow(s.start + .4, true) +
        '<h1 class="title fit">' + hookTitle(tip.title, s.start + .45) + "</h1>";
      return X.shot ? '<div class="split"><div class="col">' + head + "</div>" + phone(s) + "</div>" : head;
    },
    why: (s) => (label("why") ? '<div class="kicker">' + esc(label("why")) + "</div>" : "") + '<p class="say fit">' + karaoke(tip.body, s.voiceAt, s.voiceDur) + "</p>" +
      (v.type === "matrix" ? race(v.rows, s.voiceAt + .6) : ""),
    look: (s) => '<span class="chip"><i></i>' + esc(cat.label) + '</span><div class="stage"><div class="orbit" style="animation-duration:' + sec(s.dur) + ";animation-delay:" + sec(s.start) +
      '"><div class="card3d a" style="animation-delay:' + sec(s.start + .15) + ";--sweep:" + sec(s.start + 2.6) + '">' + visual(tip.visual, s.start + 1.1) + "</div></div></div>" +
      (v.type === "scores" ? benchStrip(s.start + 2.4) : ""),
    more: (s) => {
      const lead = label("more");
      const spoken = (lead ? lead + " " : "") + tip.more;
      const shift = s.voiceDur * (lead ? (lead.length + 1) / spoken.length : 0);
      return '<div class="glass fact" style="--sweep:' + sec(s.start + 1) + '"><span class="glyph">?</span>' + (lead ? '<div class="kicker">' + esc(lead) + "</div>" : "") +
        (v.type === "scores" ? radar(v.areas, s.start + .6) : "") +
        '<p class="say fit">' + karaoke(tip.more, s.voiceAt + shift, s.voiceDur - shift) + "</p></div>";
    },
    fix: (s) => {
      const steps = (tip.steps || []).length > 1 ? '<ol class="picks">' + tip.steps.map((step, i) => '<li class="pick" style="animation-delay:' + sec(s.voiceAt + s.voiceDur * .3 + i * .25) + '"><span class="n">' + (i + 1) + "</span><b>" + esc(step) + "</b></li>").join("") + "</ol>" : "";
      return '<div class="kicker">' + esc(tip.actionLabel || ui.tryThis) + '</div><p class="say fit">' + karaoke(tip.action, s.voiceAt, s.voiceDur) + "</p>" + steps +
        '<span class="url a in-up" style="animation-delay:' + sec(s.start + 1.2) + '">' + esc(guideHost) + "</span>";
    } };
  const end = scenes.find((s) => s.id === "end");
  c.innerHTML =
    fusion("clip", L) + '<div class="world" style="' + L + '"><div class="floor" style="' + L + '"></div>' +
      cubeHtml("--s:120px;left:820px;top:300px;" + L) + cubeHtml("--s:70px;left:120px;top:1500px;animation-direction:reverse;" + L) + cubeHtml("--s:46px;left:930px;top:1640px;" + L) + dots + "</div>" +
    '<div class="grain"></div>' +
    '<div class="progress">' + scenes.map((s) => '<i style="--w:' + s.dur.toFixed(2) + '"><b style="animation-duration:' + sec(s.dur) + ";animation-delay:" + sec(s.start) + '"></b></i>').join("") + "</div>" +
    '<div class="masthead top a in-up" style="animation-delay:.1s"><div class="brand">' + MARK + '<div><b>QA-lab</b><small>URL Review</small></div></div><span class="count">' + esc(tip.counter || ui.tip + " " + String(index + 1).padStart(2, "0") + " / " + total) + "</span></div>" +
    '<div class="rig" style="' + L + '">' + scenes.filter((s) => body[s.id]).map((s) => scene(s, body[s.id](s))).join("") + "</div>" +
    '<div class="end a" style="animation-delay:' + sec(end.start) + '">' + MARK + "<h2>" + (ui.end ? esc(ui.end) : 'Let your page<br><em style="font-style:italic">do the talking.</em>') + "</h2><p>" + esc(ui.endNote) + '</p><span class="url">' + esc(guideHost) + "</span>" +
      (X.logo && ui.reviewed ? '<span class="reviewed">' + logo(X.logo) + esc(ui.reviewed) + " · " + esc(X.host) + "</span>" : "") +
      ((X.nets || []).length && ui.follow ? '<div class="follow"><small>' + esc(ui.follow) + " " + esc(X.handle || "") + '</small><div class="nets">' + X.nets.map((b) => bmark(b)).join("") + "</div></div>" : "") + "</div>";
  const shot = c.querySelector(".phone img");
  const ready = shot ? shot.decode().catch(() => {}).then(() => { shot.style.setProperty("--scroll", Math.min(0, shot.parentElement.clientHeight - shot.offsetHeight) + "px"); }) : Promise.resolve();
  return Promise.all([document.fonts.ready, ready, smallLogos(c)]).then(() => {
    c.querySelectorAll(".sc").forEach((sc) => {
      const box = sc.firstElementChild;
      for (let k = 0; k < 12 && box.offsetHeight > sc.clientHeight; k += 1) {
        sc.querySelectorAll(".fit").forEach((el) => { el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * .92).toFixed(1) + "px"; });
        if (!sc.querySelector(".fit")) break;
      }
      if (box.offsetHeight > sc.clientHeight) { c.classList.add("tight"); box.style.zoom = (sc.clientHeight / box.offsetHeight).toFixed(3); }
    });
    return true;
  });
};

window.seek = function (seconds) {
  document.getAnimations().forEach((a) => { a.pause(); a.currentTime = seconds * 1000; });
};
</script>
</body>
</html>
