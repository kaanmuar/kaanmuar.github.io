<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab Tries</title>
<link rel="stylesheet" href="css/qa-review-progress.css?v=20261120g">
<link rel="stylesheet" href="css/qa-review-arena.css?v=20261120g">
<style>
  html, body { margin: 0; min-height: 100%; background: #050d11; color: #e8f3f4; }
  html.rc-noscroll { overflow: hidden; }
  #run-panel {
    margin: 0;
    padding: 0;
    border: 0;
    min-height: 100dvh;
    max-width: none;
    box-shadow: none;
    background: #050d11;
  }
  #run-panel h2,
  #report-once,
  #log-next {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }
  #run-log { list-style: none; margin: 0; padding: 0; }
  #run-log > li {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
  }
  #run-panel .rp { max-width: 100%; }
  #run-panel.rp-on .rp { margin: 0; padding: 8px 8px 0; }
</style>
</head>
<body>
<section id="run-panel" class="card log-card">
  <h2>Review log</h2>
  <p id="report-once">Native packaged arena.</p>
  <ol class="log" id="run-log"></ol>
  <ol class="log-next" id="log-next"></ol>
</section>
<script src="js/qa-review-progress.js"></script>
<script src="js/qa-review-arena-facts.js?v=20261120a"></script>
<script src="js/qa-review-arena-atlas.js?v=20261120a"></script>
<script src="js/qa-review-arena-motion.js?v=20261120e"></script>
<script src="js/qa-review-console.js?v=20261120g"></script>
<script src="js/qa-review-arena.js?v=20261120g"></script>
<script src="js/native-bridge.js"></script>
</body>
</html>
