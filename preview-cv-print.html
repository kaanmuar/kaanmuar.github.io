<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #12181f; --muted: #4a5560; --line: #d5dce3; --accent: #0d6e76; --paper: #f3f1ec; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, Arial, sans-serif; }
    .preview-bar { position: sticky; top: 0; z-index: 2; background: #1c242c; color: #f4f7f8; padding: 10px 16px; font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }
    .preview-bar strong { font-weight: 600; }
    #desk { padding: 24px 16px 48px; }
    .sheet { width: 210mm; height: 297mm; margin: 0 auto 18px; background: #fff; position: relative; }
    .sheet-body { position: absolute; top: 14mm; left: 16mm; right: 16mm; bottom: 12mm; overflow: hidden; }
    .sheet-foot { position: absolute; left: 16mm; right: 16mm; bottom: 6mm; border-top: 1px solid var(--line); padding-top: 2mm; display: flex; justify-content: space-between; font-size: 8pt; color: var(--muted); }
    .measure { position: absolute; left: -10000px; top: 0; width: 178mm; }
    h1, h2, h3 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; color: var(--ink); }
    h1 { font-size: 22pt; line-height: 1.05; margin: 0; letter-spacing: -0.02em; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
    .role { margin: 4px 0 0; font-size: 11pt; color: var(--accent); font-weight: 600; }
    .loc, .contact { margin: 3px 0 0; font-size: 9pt; color: var(--muted); }
    .contact { line-height: 1.4; }
    h2 { font-size: 12pt; margin: 14px 0 6px; padding-bottom: 2px; border-bottom: 1.5px solid var(--accent); }
    p { margin: 0 0 7px; font-size: 10.5pt; line-height: 1.45; }
    .skill { margin-bottom: 4px; }
    .live { margin-bottom: 4px; }
    .job { margin: 0 0 16px; }
    .job.current { margin-top: 2px; padding-left: 10px; border-left: 3px solid var(--accent); }
    .now { display: inline-block; margin-right: 8px; padding: 1px 6px 2px; border: 1px solid var(--accent); color: var(--accent); font-family: Inter, Arial, sans-serif; font-size: 8pt; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: 2px; }
    .job-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .job h3 { font-size: 11pt; margin: 0; }
    .dates { margin: 0; font-size: 9.5pt; color: var(--muted); white-space: nowrap; }
    .company { margin: 1px 0 4px; font-size: 10pt; font-weight: 600; }
    ul { margin: 0; padding: 0 0 0 16px; }
    li { font-size: 10.5pt; line-height: 1.45; margin: 0 0 3px; }
    .block { display: flow-root; }
    .stack { margin: 3px 0 0; font-size: 8.5pt; line-height: 1.35; color: var(--muted); }
    .stack span { color: var(--accent); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 7.5pt; margin-right: 4px; }
    .edu { margin-bottom: 2px; }
  </style>
</head>

  <script>
    const blocks = ["\n  <header class=\"mast\">\n    <h1>Carlos A. Muñoz</h1>\n    <p class=\"role\">Senior IT Project Manager, QA Architect &amp; QA Leader</p>\n    <p class=\"loc\">Medellín, Colombia</p>\n    <p class=\"contact\"><a href=\"mailto:kaanmuar@gmail.com\" target=\"_blank\" rel=\"noopener noreferrer\">kaanmuar@gmail.com</a> · <a href=\"tel:+573209191010\" target=\"_blank\" rel=\"noopener noreferrer\">+57 320 919 1010</a> · <a href=\"https://www.linkedin.com/in/carlos-andres-m-2a60b8b/\" target=\"_blank\" rel=\"noopener noreferrer\">linkedin.com/in/carlos-andres-m-2a60b8b</a> · <a href=\"https://kaanmuar.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">kaanmuar.github.io</a></p>\n  </header>\n","<h2>See the work for yourself</h2>","<p class=\"live\"><a href=\"https://kaanmuar.github.io/qa-lab.html\" target=\"_blank\" rel=\"noopener noreferrer\">QA regression lab</a> — Curious how this CV gets checked? Open it and watch the tests move through the page, then see what passed. Free, and nothing to install.</p>","<p class=\"live\"><a href=\"https://kaanmuar.github.io/simulador.html\" target=\"_blank\" rel=\"noopener noreferrer\">SDLC studio</a> — Want to sit in on a software project? Open it and follow one feature from the planning board until the team has tested it and it is ready to ship.</p>","<h2>Skills</h2>","<p class=\"skill\"><strong>Delivery.</strong> Agile, Kanban, Scrum, Strategic Planning, Risk Management, Stakeholder Mgmt, Jira, TestRail, Testlio, MS Project, CMMI, ISO Standards</p>","<p class=\"skill\"><strong>Quality engineering.</strong> Selenium, Cypress, Playwright, WebdriverIO, Protractor, Appium, Expresso, Robot Framework, Cucumber, Gauge, Karate DSL, JMeter, Katalon</p>","<p class=\"skill\"><strong>Languages and test frameworks.</strong> Python, Java, JavaScript, TypeScript, Ruby on Rails, TestNG, Jasmin, Jest, Mocha, Chai, Watir, Watin</p>","<p class=\"skill\"><strong>Cloud and delivery.</strong> AWS, Azure DevOps, GCP, Jenkins, Docker, GitHub</p>","<p class=\"skill\"><strong>Observability and security.</strong> Datadog, Grafana, New Relic, Splunk, Owasp, W3C</p>","<p class=\"skill\"><strong>Platforms.</strong> Salesforce, MS Dynamics, SAP, Zoho CRM</p>","<p class=\"skill\"><strong>Systems.</strong> Middleware, Toad, Eclipse, Cygwin</p>","<h2>Current role</h2>","\n    <article class=\"job current\">\n      <div class=\"job-row\">\n        <h3><span class=\"now\">Current</span>Senior QA &amp; Program Consultant</h3>\n        <p class=\"dates\">Jan 2021 - Present</p>\n      </div>\n      <p class=\"company\"><a href=\"https://www.teaminternational.com\" target=\"_blank\" rel=\"noopener noreferrer\">Team International</a></p>\n      <ul><li>Delivered expert QA and project leadership services across 15+ client projects in diverse sectors including FinTech, HealthTech, and retail.</li><li>Acted as a key technical interviewer for QA roles (from Junior to Architect), establishing a high bar for talent acquisition and ensuring team excellence.</li><li>Architected and implemented scalable test automation strategies using Cypress, Playwright, WebdriverIO, and Selenium for various client applications.</li><li>Provided expert consultancy on specialized automation, including for Salesforce (Provar) and ServiceNow (ATF) ecosystems.</li><li>Managed project workflows and defect tracking using Jira and TestRail, providing clear visibility to all stakeholders.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Agile, Scrum, Kanban, Jira, TestRail, Cypress, Playwright, Selenium, WebdriverIO, TestNG, Jasmin, Provar, ServiceNow ATF, JavaScript, TypeScript, Appium, Katalon, Gauge, Testlio, New Relic, Jest, Mocha, Chai, Watir</p>\n    </article>\n  ","<h2>Certifications</h2>","<p class=\"edu\"><strong>English proficiency</strong> · EF SET C2 Proficient</p>","<p class=\"edu\"><strong>Project management</strong> · CSPM</p>","<p class=\"edu\"><strong>Quality assurance</strong> · CASQ, CAST, CSQA, ISTQB</p>","<p class=\"edu\"><strong>Information security</strong> · CISA, CISM, CISSP</p>","<h2>Languages</h2>","<p>Spanish, native · English, fluent (C2) · Portuguese, fluent · Others, basic</p>","<h2>Experience</h2>","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Senior Technical Project Manager &amp; Consultant</h3>\n        <p class=\"dates\">Apr 2019 - Mar 2021</p>\n      </div>\n      <p class=\"company\"><a href=\"https://www.rockstarcoders.com\" target=\"_blank\" rel=\"noopener noreferrer\">RockStar Coders Agency</a></p>\n      <ul><li>Provided technical project management and QA leadership for clients across 8+ projects, including for OverActive and the Afar Project.</li><li>Led QA strategy and execution, defining technical solutions with Protractor and Expresso to optimize testing processes and improve delivery quality.</li><li>Implemented robust automation frameworks using Kotlin, Selenium, and Appium, integrated into CI/CD pipelines with Jenkins and GitLab.</li><li>Conducted rigorous technical interviews for incoming QA engineers, acting as a professional gatekeeper to maintain high standards for new hires.</li><li>Proactively identified and mitigated potential risks by implementing robust QA practices and risk management protocols, including security checks with Owasp.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Kanban, Agile, Risk Management, Selenium, Appium, Kotlin, Jenkins, GitLab, Jira, Scrum, Protractor, Expresso, Karate DSL, Watin, Owasp</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Sr. Project Manager &amp; QA Engineer</h3>\n        <p class=\"dates\">Apr 2017 - May 2018</p>\n      </div>\n      <p class=\"company\"><a href=\"https://www.globant.com\" target=\"_blank\" rel=\"noopener noreferrer\">Globant</a></p>\n      <ul><li>Led all QA efforts for Salesforce Sales Cloud and Service Cloud projects for the high-profile DirectvGO / AT&amp;T account.</li><li>Managed test planning, resource estimation, and client communications, ensuring alignment with project timelines and deliverables.</li><li>Architected automation using Provar for Salesforce and the ServiceNow ATF, while also building API tests with Karate DSL.</li><li>Frequently served as the lead technical interviewer for QA candidates, assessing their skills in automation, performance, and security testing.</li><li>Performed complex data validation using advanced SQL queries against Oracle and PostgreSQL databases, monitored with New Relic.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Salesforce, Provar, ServiceNow ATF, AWS, SQL, Kotlin, C#, .NET, Robot Framework, Oracle, PostgreSQL, Jira, Agile, Kanban, Scrum, Cypress, Tosca, Katalon, Datadog, MongoDB, New Relic, Karate DSL</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Sr. QA Engineer</h3>\n        <p class=\"dates\">May 2016 - Apr 2017</p>\n      </div>\n      <p class=\"company\"><a href=\"https://www.geniussports.com\" target=\"_blank\" rel=\"noopener noreferrer\">Genius Sports</a></p>\n      <ul><li>Provided quality assistance by mentoring development teams on delivering high-quality software products for real-time sports data platforms.</li><li>Worked with Product Owners to define and refine user stories and acceptance criteria in a fast-paced Agile environment.</li><li>Developed and executed comprehensive test scripts for both backend APIs and frontend applications using TestNG and Jasmin.</li><li>As part of the hiring committee, conducted technical interviews to vet and select qualified QA candidates.</li><li>Contributed to the improvement of quality processes, focusing on early defect detection and prevention.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Agile, Jira, SQL, Postman, Grafana, Kanban, Scrum, Python, Cucumber, JMeter, Rest Assured, GitHub, TestNG, Jasmin</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Sr. Technical Architect</h3>\n        <p class=\"dates\">Aug 2015 - Mar 2016</p>\n      </div>\n      <p class=\"company\"><a href=\"https://zagalabs.com\" target=\"_blank\" rel=\"noopener noreferrer\">Zagalabs</a></p>\n      <ul><li>Managed the overall testing scope for client projects, ensuring alignment with strategic business objectives.</li><li>Set program roadmaps, established project priorities, and resolved conflicts to enhance effectiveness towards business results.</li><li>Established the technical interview process for all QA hires, personally vetting senior and architect-level candidates.</li><li>Mentored and guided a matrixed team of testing resources to ensure comprehensive test coverage using frameworks like Jest and Mocha.</li><li>Built direct relationships with customer stakeholders to ensure objectivity and promote continuous growth.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Stakeholder Mgmt, Strategic Planning, TestRail, Agile, Kanban, Scrum, Jira, Cypress, MS Project, Jest, Mocha, Chai</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Sr. Strategic Development Manager</h3>\n        <p class=\"dates\">Sep 2014 - Mar 2015</p>\n      </div>\n      <p class=\"company\"><a href=\"https://thecollectiveintelligencegroup.com\" target=\"_blank\" rel=\"noopener noreferrer\">The Collective Intelligence Group</a></p>\n      <ul><li>Supported the organization's strategic and long-range goal planning, identifying new market opportunities.</li><li>Provided business development and capture support for corporate IT opportunities, building relationships with agency stakeholders.</li><li>Fostered relationships with potential teaming partners to target IT opportunities aligning with corporate plans.</li><li>Managed multiple ongoing projects and followed up with internal teams to develop growth strategies.</li><li>Assessed partner capabilities, selected teaming partners, and developed long-term strategic relationships.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Strategic Planning, Stakeholder Mgmt, Agile, Kanban, Scrum, Jira</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Sr. Project Manager</h3>\n        <p class=\"dates\">Sep 2013 - Sep 2014</p>\n      </div>\n      <p class=\"company\"><a href=\"https://bitgray.co\" target=\"_blank\" rel=\"noopener noreferrer\">Bitgray</a></p>\n      <ul><li>Managed a portfolio of complex enterprise software initiatives, spanning multiple lines of business.</li><li>Provided on-site leadership for project teams, building and motivating team members to meet project goals and milestones.</li><li>Owned the full project life cycle, from initiation and planning to successful deployment and post-launch support.</li><li>Managed all aspects of multiple related projects to ensure the overall program directly supported strategic objectives.</li><li>Reported project status, risks, and progress to executive leadership and stakeholders.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Agile, Risk Management, Jira, Kanban, Scrum, MS Project</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>CISO - Chief Information Security Officer</h3>\n        <p class=\"dates\">Apr 2013 - Oct 2013</p>\n      </div>\n      <p class=\"company\">MCHC Consultance Inc.</p>\n      <ul><li>Led Information Security and Software Validation initiatives for the consultancy and its clients.</li><li>Developed and implemented Disaster Recovery Plans (DRP) and Business Continuity Processes (BCP).</li><li>Championed a security-aware culture through organization-wide training and process implementation based on ISO 27001.</li><li>Mitigated risks by identifying superior market opportunities and potential security threats.</li><li>Developed and enhanced the team's skills through targeted training and conferences.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Risk Management, ISO Standards, CISA, CISM, CISSP, Agile, Kanban, Scrum, Jira</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Sr. Hybrid QA Engineer / QA Lead</h3>\n        <p class=\"dates\">Jun 2012 - Mar 2013</p>\n      </div>\n      <p class=\"company\"><a href=\"https://www.prodigious.com\" target=\"_blank\" rel=\"noopener noreferrer\">Prodigious LATAM (Razorfish)</a></p>\n      <ul><li>Led QA efforts on projects for major US-based clients, leveraging a hybrid onshore/offshore model.</li><li>Wrote and executed complex automated test scripts using Selenium, Watir, and Watin.</li><li>Performed extensive testing on front-end (HTML/CSS/DHTML/JavaScript) and back-end (Java/.NET/RoR) technologies.</li><li>Managed bug tracking and reporting using Jira and Bugzilla, ensuring clear communication with development teams.</li><li>Used Firebug for in-depth debugging and analysis of web applications, adhering to W3C standards.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Selenium, Jira, Bugzilla, Java, .NET, DHTML, Firebug, Agile, Kanban, Scrum, SoapUI, Ruby on Rails, Watir, Watin, W3C</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>ISE Engineer LATAM</h3>\n        <p class=\"dates\">Jan 2012 - Jul 2012</p>\n      </div>\n      <p class=\"company\"><a href=\"https://www.advantech.com\" target=\"_blank\" rel=\"noopener noreferrer\">Advantech</a></p>\n      <ul><li>Focused on customer project development, offering standard products and integration services across Latin America.</li><li>Developed the direct business channel by growing existing accounts and prospecting for new clients.</li><li>Visited customers with well-prepared demo kits and materials to showcase technical solutions.</li><li>Worked closely with marketing and technical teams to align sales strategies with product capabilities.</li><li>Maintained and updated the CRM database, managed sales pipelines, and closed orders.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Stakeholder Mgmt, Agile, Kanban, Scrum, Jira</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Business Tender Specialist - LATAM</h3>\n        <p class=\"dates\">Mar 2011 - Dec 2011</p>\n      </div>\n      <p class=\"company\"><a href=\"https://www.intel.com\" target=\"_blank\" rel=\"noopener noreferrer\">Intel Corporation</a></p>\n      <ul><li>Provided technical assessment and advice to government, B2B, and corporate customers on Intel product acquisitions.</li><li>Managed daily interactions with major manufacturers to align on product specifications and availability.</li><li>Tracked and studied business tenders across Latin America to identify and influence opportunities.</li><li>Delivered key information and product roadmaps to covered accounts and co-partner sales teams.</li><li>Actively coordinated and managed end-customer targeted activities like webinars and training sessions.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Strategic Planning, Stakeholder Mgmt, Agile, Kanban, Scrum, Jira</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Solutions Engineer - Special Projects LATAM</h3>\n        <p class=\"dates\">Aug 2010 - Feb 2011</p>\n      </div>\n      <p class=\"company\"><a href=\"https://www.belcorp.com\" target=\"_blank\" rel=\"noopener noreferrer\">Belcorp</a></p>\n      <ul><li>Oversaw all aspects of solution development, from concept ideation through development, launch, and maintenance.</li><li>Provided leadership and strategic guidance to development, account, and executive management teams.</li><li>Interfaced with cross-functional teams to ensure consistency in solution development and implementation.</li><li>Promoted the use of strategic solutions and offerings by the business development community.</li><li>Developed and grew the portfolio of solutions and offerings to increase company productivity and profits.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Strategic Planning, Agile, Kanban, Scrum, Jira</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Partner Product Manager - NOLA</h3>\n        <p class=\"dates\">Nov 2009 - Aug 2010</p>\n      </div>\n      <p class=\"company\"><a href=\"https://www.mcafee.com\" target=\"_blank\" rel=\"noopener noreferrer\">McAfee</a></p>\n      <ul><li>Served as both a Business Development Manager and a technical implementation leader for the North of Latin America region.</li><li>Developed and managed multiple partner implementation portfolios for McAfee security solutions.</li><li>Worked with engineering and product management to define, manage, and deploy signed partner agreements.</li><li>Provided pre-sales guidance and support, leveraging a diverse knowledge of existing and planned partner releases.</li><li>Researched, validated, and prioritized implementation requirements for new and existing accounts.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Risk Management, Stakeholder Mgmt, Agile, Kanban, Scrum, Jira</p>\n    </article>\n  ","\n    <article class=\"job\">\n      <div class=\"job-row\">\n        <h3>Advanced Technologies Advisor</h3>\n        <p class=\"dates\">Feb 2002 - May 2008</p>\n      </div>\n      <p class=\"company\">S&amp;G Consultance Ltd.</p>\n      <ul><li>Advised clients on software acquisition, distribution, IT development, and web/intranet tools.</li><li>Provided administrative and operative coaching, focusing on HR potential, organizational processes, and innovation.</li><li>Was in charge of the Software and Technology area, utilizing tools like Java, Perl, Oracle, SQL, and Cisco Networking environments.</li><li>Advised on technology, corporate, and commercial/marketing strategies, including market analysis and new market incursions.</li><li>Implemented process improvements based on SEI, CMM, CMMI, and ISO standards.</li></ul>\n      <p class=\"stack\"><span>Stack</span> Java, Perl, Oracle, SQL, CMMI, ISO Standards, Middleware, Agile, Kanban, Scrum, Jira, JUnit, Cygwin, Putty, SSH, Toad, Eclipse, MySQL</p>\n    </article>\n  ","<h2>Education</h2>","<p class=\"edu\"><strong>Specialization in Management on IT Projects</strong> · Alexander Von-Humboldt University</p>","<p class=\"edu\"><strong>Computer Systems Engineering</strong> · EAMQ</p>","<p class=\"edu\"><strong>Computer Systems Technician</strong> · EAMQ</p>","<h2>Summary</h2>","<p>A Senior IT Project Manager and QA Architect with over 18 years of experience delivering high-quality, complex software solutions for global technology leaders. Expert in strategic planning, stakeholder management, and leading cross-functional teams to meet project goals. Proven ability to architect and implement robust QA automation frameworks (Selenium, Cypress, Kotlin), ensuring exceptional product quality and efficiency for clients like Autodesk, AT&amp;T, and Sophos.</p>","<p>Throughout my career, I have championed a holistic approach to quality, embedding QA processes into every stage of the SDLC. As a QA Architect, I specialize in designing scalable, maintainable, and efficient automation frameworks from the ground up, tailored to the specific needs of the product and technology stack. My expertise extends to selecting the optimal tools, establishing best practices, and creating CI/CD integrations that provide rapid, reliable feedback to development teams, significantly reducing regression cycles and accelerating time-to-market.</p>","<p>As a Project Manager and Leader, I excel at building and mentoring high-performing, cross-cultural teams. I have a proven track record of managing multi-million dollar project portfolios, mitigating risks, and aligning technical execution with executive-level business strategy. My leadership philosophy is centered on clear communication, empowerment, and fostering a collaborative environment where every team member is motivated to contribute their best work. My C2 English proficiency and multilingual abilities allow me to seamlessly manage global teams and stakeholders.</p>"];
    const measure = document.getElementById("measure");
    const desk = document.getElementById("desk");

    function pack() {
      measure.innerHTML = blocks.map((html, i) => '<div class="block" data-i="' + i + '">' + html + "</div>").join("");
      const bodyLimit = measure.parentElement.querySelector(".sheet-body") 
        ? 0 
        : null;
      const probe = document.createElement("div");
      probe.className = "sheet";
      probe.style.visibility = "hidden";
      probe.innerHTML = '<div class="sheet-body"></div>';
      document.body.appendChild(probe);
      const limit = probe.querySelector(".sheet-body").clientHeight;
      probe.remove();

      const nodes = [...measure.children];
      const heights = nodes.map((node) => node.getBoundingClientRect().height);
      const pages = [];
      let page = [];
      let used = 0;
      const slack = 8;
      nodes.forEach((node, index) => {
        const h = heights[index];
        const isHead = node.querySelector(":scope > h2");
        const next = heights[index + 1] || 0;
        const room = limit - used - slack;
        if (used > 0 && h > room) {
          pages.push(page);
          page = [];
          used = 0;
        } else if (used > 0 && isHead && next > 0 && h + next > room) {
          pages.push(page);
          page = [];
          used = 0;
        }
        page.push(node.innerHTML);
        used += h;
      });
      if (page.length) pages.push(page);

      desk.innerHTML = pages.map((parts, index) => `
        <section class="sheet" id="page-${index + 1}">
          <div class="sheet-body">${parts.join("")}</div>
          <footer class="sheet-foot">
            <span>Carlos A. Muñoz · <a href="https://kaanmuar.github.io/">kaanmuar.github.io</a></span>
            <span>${index + 1} / ${pages.length}</span>
          </footer>
        </section>
      `).join("");
      document.getElementById("count").textContent = pages.length + " pages · A4";
      measure.remove();
    }

    document.fonts.ready.then(() => requestAnimationFrame(pack));
  </script>
</body>
</html>
