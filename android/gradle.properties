org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Sentry ProGuard/R8 mapping upload (#3836). Prefer env vars; gradle properties are for local overrides.
# Never commit auth tokens. Upload runs only when SENTRY_AUTH_TOKEN (or sentry.auth.token) is set together
# with org + project; otherwise the plugin is a no-op and assembleRelease stays green in local/CI.
#   SENTRY_AUTH_TOKEN / sentry.auth.token
#   SENTRY_ORG         / sentry.org
#   SENTRY_PROJECT     / sentry.project
